let statMode = 'train', trainDays = 30;
const MISSION_COLORS = { mandatory: 'var(--accent)', review: 'var(--c-review)', backtest: 'var(--s5)', video: 'var(--c-video)', exercise: 'var(--c-ex)' };
const MISSION_LABELS = { mandatory: '필수 분석', review: '검증', backtest: '백테스트', video: '영상', exercise: '운동' };
function statSeg() {
  return `<div class="seg"><button class="opt ${statMode === 'train' ? 'on' : ''}" onclick="App.setStatMode('train')">훈련</button><button class="opt ${statMode === 'pred' ? 'on' : ''}" onclick="App.setStatMode('pred')">예측 점수</button></div>`;
}
const mdOf = k => { const [, m, d] = k.split('-'); return `${+m}/${+d}`; };
function rateRow(label, a, b) {
  const p = b ? Math.round(a / b * 100) : 0;
  return `<div class="brow w"><span class="nm">${label}</span><span class="bar"><i style="width:${p}%;background:var(--accent)"></i></span><span class="v"><b>${b ? p + '%' : '-'}</b> · ${a}/${b}일</span></div>`;
}
async function renderTrainStats() {
  const st = await dayStats(), t = st.today, N = trainDays, goal = S.dailyGoal || DEFAULT_GOAL;
  const keys = []; for (let i = N - 1; i >= 0; i--) keys.push(addDays(t, -i));
  const rows = keys.map(k => ({ k, sc: st.scoreOf(k), done: st.complete(k), before: k < st.firstDay }));
  const live = rows.filter(r => !r.before), E = live.length;
  const totals = live.map(r => r.sc.total), max = Math.max(goal, ...rows.map(r => r.sc.total), 1);
  const avg = E ? Math.round(totals.reduce((a, b) => a + b, 0) / E) : 0;
  const goalDays = live.filter(r => r.sc.total >= goal).length;
  let best = 0, cur = 0;
  for (let k = st.firstDay; k <= t; k = addDays(k, 1)) { if (st.complete(k)) { cur++; best = Math.max(best, cur); } else cur = 0; }
  let h = statSeg() + `<div class="grid2" style="margin-bottom:12px"><button class="opt ${N === 7 ? 'on' : ''}" onclick="App.setTrainDays(7)">최근 7일</button><button class="opt ${N === 30 ? 'on' : ''}" onclick="App.setTrainDays(30)">최근 30일</button></div>`;
  h += `<div class="stats3">
    <div class="stat"><b>${avg}</b><span class="sub">하루 평균 점수</span></div>
    <div class="stat"><b>${goalDays}<small style="font-size:13px;color:var(--muted)">/${E}일</small></b><span class="sub">목표 ${goal}점 달성</span></div>
    <div class="stat"><b>${st.streak}<small style="font-size:13px;color:var(--muted)">/${best}</small></b><span class="sub">연속 지금/최장</span></div>
  </div>`;
  // 날짜별 점수 막대 (미션별로 쌓음)
  h += `<div class="section-title"><span>날짜별 점수</span><span>목표 ${goal}점</span></div><section class="card">
    <div class="dchart">
      <div class="dgoal" style="bottom:${(goal / max * 100).toFixed(1)}%"></div>
      ${rows.map(r => `<div class="dcol"><div class="dstack" style="height:${(r.sc.total / max * 100).toFixed(1)}%">${Object.keys(MISSION_COLORS).map(c => r.sc.parts[c] ? `<i style="flex:${r.sc.parts[c]};background:${MISSION_COLORS[c]}"></i>` : '').join('')}</div></div>`).join('')}
    </div>
    <div class="ddots">${rows.map(r => `<span class="${r.before ? '' : r.done ? 'ok' : 'no'}"></span>`).join('')}</div>
    <div class="dx"><span>${mdOf(keys[0])}</span><span>${N === 7 ? keys.slice(1, 6).map(mdOf).join('</span><span>') + '</span><span>' : ''}${mdOf(keys[N - 1])}</span></div>
    <div class="legend">${Object.keys(MISSION_COLORS).map(c => `<span><i style="background:${MISSION_COLORS[c]}"></i>${MISSION_LABELS[c]}</span>`).join('')}</div>
    <div class="hint">아래 점: 초록 = 필수 분석 완료, 빨강 = 빠진 날 · 가로선 = 하루 목표</div>
  </section>`;
  // 미션별 달성률
  h += `<div class="section-title"><span>미션 달성률</span><span>최근 ${N}일</span></div><section class="card">
    ${rateRow('필수 분석', live.filter(r => r.done).length, E)}
    ${rateRow(`백테스트 ${S.scores.backtestGoal}개`, live.filter(r => r.sc.d.backtests >= S.scores.backtestGoal).length, E)}
    ${rateRow('영상 공부', live.filter(r => r.sc.d.videoOk > 0).length, E)}
    ${rateRow('운동', live.filter(r => r.sc.d.exDone.size > 0).length, E)}
  </section>`;
  // 백테스트 기법별 (기간 안)
  const from = keys[0], bts = (await getAll('backtests')).filter(b => dayKey(b.createdAt) >= from);
  if (bts.length) {
    const rowsT = techniques.map(tq => ({ tq, s: techStats(bts, tq.id) })).filter(x => x.s.n).sort((a, b) => b.s.n - a.s.n);
    const worst = rowsT.slice().sort((a, b) => b.s.l - a.s.l)[0];
    h += `<div class="section-title"><span>백테스트 기법별 성공률</span><span>${bts.length}개</span></div><section class="card">
      ${rowsT.map(({ tq, s }) => `<div class="brow w click" onclick="App.openTech('${tq.id}')"><span class="nm">${esc(tq.name)}</span><span class="bar"><i style="width:${s.rate}%;background:var(--s5)"></i></span><span class="v"><b>${s.rate}%</b> · ${s.n}개</span></div>`).join('')}
      ${worst && worst.s.l ? `<div class="hint">실패가 가장 많은 기법: <b>${esc(worst.tq.name)}</b> (실패 ${worst.s.l}개) — 실패 이유를 모아 보세요.</div>` : ''}
    </section>`;
  }
  // 영상·운동
  const vids = (await getAll('videos')).filter(v => dayKey(v.createdAt) >= from);
  const logs = (await getAll('exerciseLogs')).filter(l => l.day >= from), exs = await getAll('exercises');
  const exCount = exs.map(e => ({ e, n: new Set(logs.filter(l => l.exerciseId === e.id).map(l => l.day)).size })).filter(x => x.n).sort((a, b) => b.n - a.n);
  const exMax = Math.max(1, ...exCount.map(x => x.n));
  h += `<div class="section-title"><span>영상 공부 · 운동</span><span>최근 ${N}일</span></div><section class="card">
    <div class="srow"><span class="t">영상 공부</span><b>${vids.length}개</b></div>
    ${exCount.length ? exCount.map(({ e, n }) => `<div class="brow w"><span class="nm">${esc(e.name)}</span><span class="bar"><i style="width:${Math.round(n / exMax * 100)}%;background:var(--c-ex)"></i></span><span class="v">${n}회</span></div>`).join('') : '<div class="sub" style="padding:8px 0">운동 기록이 없어요.</div>'}
  </section>`;
  $('view').innerHTML = h;
}

const EXPORT_KINDS = { full: '전체 백업', nophoto: '분석용 (사진 제외)', recent: '최근 30일' };
function fmtFull(ms) { if (!ms) return ''; const d = new Date(ms); return `${dayKey(ms)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
async function buildExport(kind) {
  const data = {};
  for (const s of [...DATA_STORES, 'settings']) data[s] = await getAll(s);
  const cut = kind === 'recent' ? Date.now() - 30 * 86400000 : 0;
  if (kind === 'recent') {
    const rmap = Object.fromEntries(data.reviews.map(r => [r.predictionId, r]));
    data.predictions = data.predictions.filter(p => p.createdAt >= cut || (rmap[p.id] && (rmap[p.id].reviewedAt || 0) >= cut));
    const keep = new Set(data.predictions.map(p => p.id));
    data.reviews = data.reviews.filter(r => keep.has(r.predictionId));
    data.backtests = data.backtests.filter(b => b.createdAt >= cut);
    data.videos = data.videos.filter(v => v.createdAt >= cut);
    data.exerciseLogs = data.exerciseLogs.filter(l => l.createdAt >= cut);
    data.groups = [];
  }
  data.photos = [];
  if (kind !== 'nophoto') {
    let photos;
    if (kind === 'full') photos = await getAll('photos');
    else {
      const need = new Set();
      data.predictions.forEach(p => (p.photoIds || []).forEach(i => need.add(i)));
      data.reviews.forEach(r => (r.resultPhotoIds || []).forEach(i => need.add(i)));
      data.backtests.forEach(b => [...(b.photoIds || []), ...(b.explainPhotoIds || [])].forEach(i => need.add(i)));
      photos = (await Promise.all([...need].map(id => getOne('photos', id)))).filter(Boolean);
    }
    for (const p of photos) { if (!p.blob) continue; const { blob, ...rest } = p; data.photos.push({ ...rest, dataUrl: await blobToDataURL(blob) }); }
  }
  return { app: APP_ID, version: VERSION, exportedAt: Date.now(), kind, from: cut || null, data };
}

  <div><b>${st.streak}일</b>지금 연속 달성</div>
  <div><b>${preds.length}</b>예측 (검증 ${reviewed.length}, 평균 ${avgScore}점)</div>
  <div><b>${bts.length}</b>백테스트 (성공률 ${bts.length ? Math.round(winAll / bts.length * 100) + '%' : '-'})</div>
  <div><b>${vids.length}</b>영상 공부</div>
  <div><b>${logs.length}</b>운동 기록</div>
</div>
<h2 id="days">날짜별 점수</h2><p class="muted">괄호 안은 점수. 필수 완료 O = 필수 종목을 모두 분석한 날</p>
${table(['날짜', '총점', '필수 분석', '검증', '백테스트', '영상', '운동', '필수 완료'], dayRows)}
<h2 id="preds">예측·검증 (${preds.length})</h2>
${table(['등록', '종목', '시간대', '예정', '상태', '분석 글', '점수', '검증', '이유 분석', '예측 사진', '결과 사진'], predRows)}
<h2 id="techs">백테스트 기법별</h2>
${table(['기법', '개수', '성공', '실패', '성공률'], techRows)}
<h2 id="bts">백테스트 (${bts.length})</h2>
${table(['날짜', '기법', '종목', '시간대', '결과', '이유', '기본 차트', '설명 차트'], btRows)}
<h2 id="videos">영상 공부 (${vids.length})</h2>
${table(['날짜', '제목', '링크', '글자 수', '느끼고 배운 점'], vRows)}
<h2 id="ex">운동 기록 (${logs.length})</h2>
${table(['날짜', '항목', '점수', '메모'], exRows)}
<p class="muted" style="margin-top:28px">이 파일을 트레이딩 훈련 노트의 설정 → 가져오기에서 고르면 기록을 복원할 수 있어요.${pl.kind === 'full' ? '' : ' (이 파일은 일부만 담고 있어 지금 기록에 합치기만 할 수 있어요.)'}</p>
<script type="application/json" id="tn-backup">${json}<\/script>
<script>
(function(){var el=document.getElementById('tn-backup');var data;try{data=JSON.parse(el.textContent);}catch(e){return;}
var m={};(data.data.photos||[]).forEach(function(p){m[p.id]=p.dataUrl;});
document.querySelectorAll('img[data-photo]').forEach(function(im){var u=m[im.getAttribute('data-photo')];if(u)im.src=u;else{var s=document.createElement('span');s.className='muted';s.textContent='사진 없음';im.replaceWith(s);}});
document.addEventListener('click',function(e){if(e.target.matches&&e.target.matches('img[data-photo]'))e.target.classList.toggle('zoom');});})();
<\/script>
</body></html>`;
}
function exportBackup() {
  showModal(`<h3>내보내기</h3>
    <div class="hint" style="font-size:14px">HTML 파일 하나로 저장해요. 휴대폰 브라우저로 열면 표로 정리된 기록을 볼 수 있고, 이 앱의 '가져오기'로 다시 복원할 수 있어요.</div>
    <div class="calrow"><div class="t"><b>전체 백업</b><br><span class="sub">모든 기록 + 사진. 휴대폰을 바꾸거나 정리하기 전에.</span></div><button class="btn small primary" onclick="App.doExport('full')">저장</button></div>
    <div class="calrow"><div class="t"><b>분석용 (사진 제외)</b><br><span class="sub">모든 기록, 파일이 가벼워요. 표로 보고 분석할 때.</span></div><button class="btn small" onclick="App.doExport('nophoto')">저장</button></div>
    <div class="calrow"><div class="t"><b>최근 30일</b><br><span class="sub">최근 30일 기록 + 사진.</span></div><button class="btn small" onclick="App.doExport('recent')">저장</button></div>
    <div class="btnrow"><button class="btn" onclick="App.closeModal()">닫기</button></div>`);
}
async function doExport(kind) {
  closeModal();
  try {
    toast('파일을 만드는 중…');
    const pl = await buildExport(kind), st = await dayStats();
    const html = reportHtml(pl, st);
    const name = `트레이딩훈련노트_${{ full: '백업', nophoto: '분석용', recent: '최근30일' }[kind]}_${stamp()}.html`;
    const ok = await saveFile(new Blob([html], { type: 'text/html' }), name);
    if (!ok) return;
    if (kind === 'full') { S.lastBackup = Date.now(); await saveSettings(); }
    toast('저장했어요');
    if (!overlayOpen()) render();
  } catch (e) { uiAlert('내보내기에 실패했어요.\n' + ((e && e.message) || '')); }
}
// 백업 파일 읽기: 새 HTML(#tn-backup) 또는 예전 JSON
function parseBackup(text) {
  const t = (text || '').trim();
  if (t.startsWith('{')) return JSON.parse(t);
  const doc = new DOMParser().parseFromString(text, 'text/html');
  const el = doc.getElementById('tn-backup');
  return el ? JSON.parse(el.textContent) : null;
}

/* =========================== 모달 / 사진 보기 =========================== */
function showModal(html) {
  $('modalRoot').innerHTML = `<div class="modal-bg" onclick="if(event.target===this)App.closeModal()"><div class="modal">${html}</div></div>`;
}
function closeModal() { $('modalRoot').innerHTML = ''; pendingImport = null; }
function viewImg(url) {
  $('modalRoot').innerHTML = `<div class="viewer" onclick="App.closeModal()"><img src="${url}" alt=""><button class="close">✕</button></div>`;
}

/* =========================== 외부 호출용 =========================== */
const App = {
  tab(v) { if (isSub(view)) return; view = v; params = {}; window.scrollTo(0, 0); render(); },
  newPrediction(symId) { closeModal(); startNewForm(typeof symId === 'string' ? symId : ''); pushPage('form'); },
  // + 버튼: 화면에 따라
  fab() {
    if (view === 'backtest') return App.newBt();
    if (view === 'home' || view === 'records') return App.newPrediction();
    showModal(`<h3>무엇을 기록할까요?</h3><div class="chooser">
      <button onclick="App.newPrediction()"><b>예측</b><span class="sub">차트 사진과 예정 시간</span></button>
      <button onclick="App.newBt()"><b>백테스트</b><span class="sub">기법별 과거 차트와 성공·실패 이유</span></button>
      <button onclick="App.newVideo()"><b>영상 공부</b><span class="sub">링크와 느끼고 배운 점</span></button>
    </div><div class="btnrow"><button class="btn" onclick="App.closeModal()">닫기</button></div>`);
  },
  // 백테스트
  newBt(techId) { closeModal(); startBtForm(typeof techId === 'string' ? techId : ''); pushPage('btform'); },
  openTech(id) { techFilter = 'all'; pushPage('tech', { id }); },
  openBt(id) { pushPage('btdetail', { id }); },
  async editBt(id) { if (await startBtEdit(id)) pushPage('btform'); },
  deleteBt, editTech, saveTech, deleteTech,
  setTechFilter(k) { techFilter = k; render(); },
  setB(k, v) { bf[k] = v; bf.dirty = true; renderBtForm(); },
  inB(v) { bf.reason = v; bf.dirty = true; const el = $('rlen'); if (el) el.textContent = v.trim().length + '자'; },
  async addTechInline() {
    const input = $('newTech'), name = input ? input.value.trim() : '';
    if (!name) { toast('기법 이름을 입력하세요'); if (input) input.focus(); return; }
    const existed = techniques.some(t => t.name === name);
    const t = await addTechniqueByName(name);
    bf.techniqueId = t.id; bf.dirty = true; renderBtForm();
    toast(existed ? `'${name}' 선택` : `'${name}' 추가 · 다음에도 버튼으로 남아요`);
  },
  async addSymInlineB() {
    const input = $('newSymB'), name = input ? input.value.trim() : '';
    if (!name) { toast('종목 이름을 입력하세요'); if (input) input.focus(); return; }
    const existed = symbols.some(s => s.name === name);
    const sy = await addSymbolByName(name, '국내주식');
    bf.symbolId = sy.id; bf.dirty = true; renderBtForm();
    toast(existed ? `'${name}' 선택` : `'${name}' 추가`);
  },
  async addBtPhotos(key, input) {
    const added = await readPhotoFiles(input, 1080);
    if (!bf || !added.length) return;
    bf[key].push(...added); bf.dirty = true; renderBtForm();
  },
  removeBtPhoto(key, j) {
    const ph = bf[key][j];
    if (ph.isNew) URL.revokeObjectURL(ph.url); else bf.removedPhotoIds.push(ph.id);
    bf[key].splice(j, 1); bf.dirty = true; renderBtForm();
  },
  saveBt,
  // 영상 공부
  newVideo() { closeModal(); startVideoForm(); pushPage('videoform'); },
  async editVideo(id) { if (await startVideoEdit(id)) pushPage('videoform'); },
  openVideos() { pushPage('videos'); },
  inV(k, v) { vf[k] = v; vf.dirty = true; if (k === 'note') { const el = $('vlen'); if (el) el.innerHTML = noteLenHtml(v.trim().length); } },
  saveVideo, deleteVideo,
  // 운동
  toggleEx(id) { toggleExercise(id); },
  exMemo, editExercise, saveExercise, deleteExercise,
  exPts(d) { exDraft.points = Math.max(0, Math.min(50, exDraft.points + d)); const el = $('mExPts'); if (el) el.textContent = exDraft.points + '점'; },
  // 통계
  setStatMode(m) { statMode = m; render(); },
  setTrainDays(n) { trainDays = n; render(); },
  doExport,
  openDetail(id) { pushPage('detail', { id }); },
  async openReview(id) { if (await startReview(id)) pushPage('review', { id }); },
  async alarmGo(id) {
    closeModal();
    if (view === 'review' && params.id === id) return;
    if (await startReview(id)) pushPage('review', { id });
  },
  async editPrediction(id) { if (await startEditForm(id)) pushPage('form'); },
  cancelPrediction, restorePrediction, deletePrediction, addToCalendar, calendarChoice,
  markCal(id) { markCalendar([id]); },
  calNext(ids, reason) { closeModal(); calendarChoice(ids, reason, true); },
  dlg(v) { closeDialog(v); },
  // 겹쳐서 비교
  compareReview() { openCompare(rv.analysis.map(photoUrl), rv.photos.map(ph => ph.url)); },
  async compareDetail(id) {
    const p = await getOne('predictions', id), r = await getOne('reviews', id);
    openCompare((await loadPhotos(p.photoIds)).map(photoUrl), (await loadPhotos(r && r.resultPhotoIds)).map(photoUrl));
  },
  cmpMode(m) { cmp.mode = m; renderCompare(); },
  cmpPick(k, i) { cmp[k] = i; cmp.adjust = false; runAlign(); },
  cmpAuto() { cmp.adjust = false; runAlign(true); },
  cmpAdjust(on) {
    if (on) { cmpEnsureFit(); if (!cmp.fit) return; cmp.adjust = true; }
    else { cmp.adjust = false; if (cmp.fit) { cmp.status = 'manual'; cmp.cache[cmp.ai + '|' + cmp.bi] = { fit: cmp.fit, status: 'manual' }; } }
    renderCompare();
  },
  cmpScale(k, v) {
    if (!cmp || !cmp.fit) return;
    // 화면 가운데를 기준으로 크기 조절
    const f = cmp.fit, a = $('cmpA'), b = $('cmpB');
    const cx = b.naturalWidth / 2, cy = b.naturalHeight / 2, nv = Math.exp(Number(v) / 100);
    if (k === 'sx') { const u = (cx - f.tx) / f.sx; f.sx = nv; f.tx = cx - u * nv; }
    else { const w = (cy - f.ty) / f.sy; f.sy = nv; f.ty = cy - w * nv; }
    cmpPlace();
  },
  cmpVal,
  closeCompare() { cmp = null; closeModal(); },
  // 용량 관리
  setCleanMonths(m) { cleanMonths = m; render(); },
  runCleanup, deleteCanceled,
  // 예측 작성
  setF(k, v) { form[k] = v; form.dirty = true; renderForm(); },
  inMemo(v) { form.memo = v; form.dirty = true; const el = $('memoLen'); if (el) el.textContent = v.trim().length ? v.trim().length + '자' : ''; },
  quick(m) { form.expectedAt = toLocalInput(Date.now() + m * 60000); form.dirty = true; renderForm(); },
  async addSymInline() {
    const input = $('newSym');
    const name = input ? input.value.trim() : '';
    if (!name) { toast('종목 이름을 입력하세요'); if (input) input.focus(); return; }
    const existed = symbols.some(s => s.name === name);
    const s = await addSymbolByName(name, '국내주식');
    form.symbolId = s.id; form.dirty = true; renderForm();
    toast(existed ? `'${name}' 선택` : `'${name}' 추가 · 다음에도 버튼으로 남아요`);
  },
  async addPhotos(input) {
    const added = await readPhotoFiles(input);
    if (!form || !added.length) return;
    form.photos.push(...added); form.dirty = true; renderForm();
  },
  removePhoto(j) {
    const ph = form.photos[j];
    if (ph.isNew) URL.revokeObjectURL(ph.url); else form.removedPhotoIds.push(ph.id);
    form.photos.splice(j, 1); form.dirty = true; renderForm();
  },
  saveForm,
  // 검증
  async addResultPhotos(input) {
    const added = await readPhotoFiles(input);
    if (!rv || !added.length) return;
    rv.photos.push(...added); rv.dirty = true; renderReview();
  },
  removeResultPhoto(j) {
    const ph = rv.photos[j];
    if (ph.isNew) URL.revokeObjectURL(ph.url); else rv.removedPhotoIds.push(ph.id);
    rv.photos.splice(j, 1); rv.dirty = true; renderReview();
  },
  setScore(n) { rv.score = n; rv.dirty = true; renderReview(); },
  inReason(v) { rv.reason = v; rv.dirty = true; },
  saveReview,
  // 공통
  viewImg, closeModal,
  editSymbol, saveSymbol, deleteSymbol, moveSymbol,
  async setS(key, v) { S[key] = v; await saveSettings(); render(); },
  async requestNotify() {
    try { await Notification.requestPermission(); } catch (e) {}
    render();
  },
  testAlarm() {
    unlockAudio();
    setTimeout(() => { beep(); vibrate(); toast(S.alarmSound ? '알람 소리가 들리면 정상이에요' : '알람 소리가 꺼져 있어요'); }, 150);
  },
  // 기록
  recPeriod(k) { recF.period = k; recF.limit = REC_PAGE; render(); },
  recSet(k, v) { recF[k] = v; recF.limit = REC_PAGE; render(); },
  recReset() { recF = { period: 'all', symbolId: '', timeframe: '', score: 0, limit: REC_PAGE }; render(); },
  recMore() { recF.limit += REC_PAGE; render(); },
  // 통계
  statPeriod(k) { statPeriod = k; render(); },
  statToRecords(k, v) {
    recF = { period: statPeriod, symbolId: '', timeframe: '', score: 0, limit: REC_PAGE };
    recF[k] = v;
    App.tab('records');
  },
  // 필수 종목·점수 기준
  async toggleMand(id) {
    const l = S.mandatorySymbolIds || [], i = l.indexOf(id);
    i >= 0 ? l.splice(i, 1) : l.push(id); S.mandatorySymbolIds = l;
    S.mandatoryEdited = true;   // 직접 고른 뒤에는 비워 둬도 기본 4종목으로 되돌리지 않음
    await saveSettings(); render();
  },
  async stepScore(k, d) {
    if (k === 'dailyGoal') S.dailyGoal = Math.max(5, Math.min(500, (S.dailyGoal || DEFAULT_GOAL) + d));
    else S.scores[k] = Math.max(k === 'backtestGoal' ? 1 : 0, Math.min(100, (S.scores[k] || 0) + d));
    await saveSettings(); render();
  },
  async resetScores() {
    if (!(await uiConfirm('점수 기준과 하루 목표를 기본값으로 되돌릴까요?', '되돌리기'))) return;
    S.scores = { ...DEFAULT_SCORES }; S.dailyGoal = DEFAULT_GOAL; await saveSettings(); render();
  },
  exportBackup, importFile, doImport
};
window.App = App;

/* =========================== 시작 =========================== */
(async function init() {
  $('verTop').textContent = VERSION;
  try {
    if (!window.indexedDB) throw new Error('이 브라우저는 저장 기능(IndexedDB)을 지원하지 않아요.');
    await openDB();
    await loadSettings();
    await seedIfNeeded();
    await loadSettings();
    await loadSymbols();
    await loadTechniques();
    await seedExercises();
    await dedupeByName('exercises', [{ store: 'exerciseLogs', field: 'exerciseId' }], e => e.active !== false);
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    const dueAtStart = await refreshStatuses();   // 앱을 열 때 확인 (방식 C)
    render();
    if (dueAtStart.length) toast(`시간이 지난 예측 ${dueAtStart.length}건 — 검증하세요`);
    setInterval(tick, TICK_MS);                    // 앱이 열려 있을 때 알람 (방식 B)
    document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
  } catch (e) {
    $('view').innerHTML = `<div class="empty">앱을 시작하지 못했어요.<br>${esc(e.message || e)}<br><br>개인정보 보호(시크릿) 모드에서는 저장이 안 될 수 있어요.</div>`;
  }
})();
