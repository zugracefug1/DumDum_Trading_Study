<!--
================================================================================
  트레이딩 훈련 노트 (Trading Training Note) — 옛 이름: 차트 예측 검증 노트
  버전: v1.2.1
  수정일: 2026-11-03
--------------------------------------------------------------------------------
  [개요]
  매일 할 일(필수 차트 분석·백테스트·영상 공부·운동)을 점수로 관리하는 트레이딩 훈련
  단일 HTML 웹앱. 중심 기능은 차트에 예상 경로를 그린 사진을 남기고, 예정 시간에
  지금 차트 사진과 비교해 1~5점으로 채점하고 이유를 적는 것.
  서버 없이 브라우저 내부(IndexedDB)에만 저장한다.

  [사용 흐름]
  하루: 오늘 화면 → 필수 4종목 분석 → 확인 필요 예측 검증 → 백테스트 20개 → 영상 1개 → 운동
  예측 등록: 종목 → 시간대 → 사진 → 분석 글(선택) → 예정 시간 → 저장 → (휴대폰 알람 안내 / 캘린더)
  검증: 알람 → 지금 차트 사진 → 예전 사진과 비교(자동 맞춤) → 1~5점 → 이유 분석 → 끝
  백테스트: 기법 → 성공/실패 → 종목 → 시간대 → 기본 차트 → 이유 → (설명 차트) → 저장하고 다음

  [현재 기능 - v1.2.1 / 1~8단계 + 분석 글]
  0. 오늘 (하단 '오늘' 탭, 앱을 열면 처음 보이는 화면)
     - 점수판: 오늘 점수 / 하루 목표(기본 60점), 달성률 막대, 연속 달성일, 미션별 점수 내역
     - 필수 차트 분석: 필수 종목(기본 골드·나스닥·비트코인·코스피) 체크 카드,
       오늘 예측을 등록한 종목은 ✓와 시간대, 누르면 그 종목이 고른 상태로 새 예측 화면
     - 확인 필요 예측 목록 (누르면 바로 검증)
     - 백테스트 n / 20 막대, 추가·기법별 보기 버튼
     - 영상 공부: 오늘 기록한 영상(점수 인정 여부), 추가·목록 버튼
     - 운동: 항목 버튼을 누르면 완료(다시 누르면 취소), 메모, ▶ 따라 할 영상 열기
     - 저장 공간·백업 안내 배너
     - 오후 9시 이후 필수 분석이 남았으면, 앱이 열려 있을 때 알림 창 (하루 한 번)
     - + 버튼: 예측 / 백테스트 / 영상 공부 중 고르기
  1. 점수 (기록에서 계산, 따로 저장하지 않음. 기준을 바꾸면 지난 날도 다시 계산)
     - 필수 종목 예측 등록: 종목당 5점 (여러 시간대여도 종목당 한 번, 취소한 예측 제외)
     - 예측 검증: 1건당 2점 (검증한 날 기준, 맞춘 정도와 상관없음)
     - 백테스트: 1개당 1점, 하루 20개 달성 보너스 5점 (21개부터도 1점씩)
     - 영상 공부: 배운 점 30자 이상인 영상만, 첫 영상 5점·두 번째부터 2점
     - 운동: 항목마다 정한 점수, 같은 항목은 하루 한 번
     - 연속 달성일: 필수 종목을 모두 분석한 날이 이어진 수 (오늘 아직이면 어제까지)
       빠뜨린 날은 감점 없이 통계에서 빨간 날로 표시
     - 하루 기준: 한국 시간 0시~24시
  2. 예측 등록 (+ 버튼, 한 화면)
     - 종목 버튼 선택 (마지막에 쓴 종목 미리 선택), 버튼 옆 입력칸으로 새 종목 추가
     - 시간대: 5분·10분·15분·30분·1시간·2시간·4시간·6시간·8시간·일·주 (1분 제외,
       예전 1분 기록은 그대로 보이고 기록·통계에도 나옴)
     - 사진 1장 이상 (필수). 자동 압축(긴 변 1280px JPEG), 실패 시 원본 저장
     - 분석 글 (선택): 왜 이렇게 예상했는지. 글자 수 표시. 예측 목록에 첫 줄, 상세·검증 화면에
       전체가 보이고 내보내기 표에도 들어감 (예전 v0.1.0 기록의 근거 메모도 여기에 보임)
     - 예정 시간: 15분 후·30분 후·1시간 후·4시간 후·내일 버튼 또는 직접 지정
     - 연속 등록: '저장하고 다른 시간대' → 같은 종목·사진·분석 글로 새 등록 화면
  3. 알람
     - 12시간 이내 예측: 저장 후 '휴대폰 알람 맞추기' 창에 맞출 시각을 크게 표시
       (갤럭시는 웹 페이지가 시계 앱에 알람을 넣을 수 없어 직접 맞추도록 안내)
     - 12시간보다 먼 예측: 캘린더 추가 창
          · 파일 버전: '휴대폰 캘린더(.ics)' 한 번에 추가 + 예측별 '구글 캘린더' 링크
          · 링크 버전: 예측별 '구글 캘린더' 링크 (링크 페이지는 .ics 저장 불가)
          (설정: 매번 묻기 / 항상 추가 / 추가 안 함)
     - 앱 내부 알람: 앱이 열려 있으면 15초마다 확인 → 소리·진동·알림 창
     - 앱을 열거나 다시 보면 시간이 지난 예측을 '확인 필요'로 표시
  4. 검증 (정답 확인)
     - 예측 사진·지금 차트 사진 위아래 비교, 1~5점, 이유 분석, 나중에 수정 가능
     - 겹쳐서 비교: 밀어 보기·겹쳐 보기, 자동 맞춤(캔들 오르내림 모양으로 위치·배율),
       확신도 표시, 직접 맞추기(이동·가로/세로 크기)
  5. 예측 탭: '진행 중'(확인 필요·대기중·최근 검증 완료·취소) / '검증 완료'(기간·종목·
     시간대·점수 필터, 건수·평균 점수), 예측 상세(사진·검증 결과·수정·취소·삭제)
  6. 백테스트 탭
     - 오늘 n / 20 막대, 전체 개수, 추가 버튼
     - 기법별: 개수·성공률 막대 → 기법 화면(전체·성공·실패 수, 성공률, 성공만/실패만,
       사례 목록, 이 기법으로 추가, 기법 이름 수정·삭제)
     - 최근 기록 15개
     - 등록: 기법(버튼 + 옆 입력칸으로 추가), 결과(성공/실패), 종목(버튼 + 입력칸),
       시간대(1분·3분 포함 13종), 기본 차트(필수), 이유(10자 이상), 설명 차트(선택)
       · 사진은 긴 변 1080px로 압축
       · '저장하고 다음': 기법·종목·시간대는 남기고 결과·사진·이유만 비움, 오늘 개수 표시
       · 마지막에 쓴 기법·종목·시간대를 다음 등록에 미리 선택
     - 상세: 기본 차트·이유·설명 차트를 크게, 수정·삭제
  7. 영상 공부
     - 링크(필수, https://), 제목(선택), 느끼고 배운 점(글자 수 표시, 30자 이상이면 점수)
     - 영상 목록(설정·오늘 화면에서): 영상 열기 링크, 배운 점, 수정·삭제
  8. 운동
     - 운동 항목(이름·점수·따라 할 영상 링크) 설정에서 추가·수정·삭제
       (기록이 있는 항목은 삭제 대신 목록에서만 빼서 지난 점수 유지)
     - 기본 항목 (즐겁고 쉬운 10분 유튜브 영상 3개): 집에서 신나게 걷기 10분(5점),
       서서 하는 유산소 10분(5점), 자기 전 누워서 스트레칭 10분(3점)
       · v1.0.0의 예전 기본 항목 5개는 v1.1.0을 처음 열 때 정리 (기록 있으면 목록에서만 빼서
         지난 점수 유지, 없으면 삭제). 직접 만든 항목은 그대로 둠 (설정 exVersion)
  9. 통계 탭
     - '훈련': 최근 7일·30일 날짜별 점수 쌓은 막대(미션별 색), 목표 선, 필수 분석 완료/빠진 날
       점, 평균 하루 점수, 목표 달성일, 연속 달성일(지금·최장), 미션별 달성률,
       백테스트 기법별 성공률(누르면 기법 화면), 실패가 가장 많은 기법, 영상 수, 운동 항목별 횟수
     - '예측 점수': 기간별 검증 건수·평균 점수·4점 이상 비율, 점수 분포, 종목별·시간대별
  10. 설정
     - 종목 관리, 필수 분석 종목, 점수 기준·하루 목표(−/+), 운동 항목, 영상 공부 목록
     - 알람(캘린더 방식·소리·진동·시스템 알림·테스트), 기본 시간대
     - 저장 공간: 사용량, 예측·결과·백테스트 사진 장수와 용량
     - 오래된 사진 정리: 3개월·6개월·1년 지난 검증 완료 예측과 백테스트의 사진만 삭제
       (점수·이유·종목·시간대·결과는 남아 통계에 그대로 반영), 취소된 예측 모두 삭제
     - 내보내기·가져오기 (아래 [백업 파일])
     - 자동 정리 (시작할 때·가져온 뒤): 이름이 같은 종목·기법·운동 항목이 여러 개면 하나로 합치고
       기록을 옮김. 필수 종목이 없는 종목을 가리키면 빼고, 직접 끈 적 없이 비면 기본 4종목으로 다시 지정
  11. 기타
     - 확인·안내 창은 모두 화면 안 창 (링크 페이지에서 alert·confirm이 막혀 있어서)
     - 저장 공간 80% 이상이면 오늘 화면 위에 정리 안내
     - 브라우저에 영구 저장 요청, 휴대폰 뒤로가기로 이전 화면, 작성 중 이탈 시 확인

  [백업 파일 - HTML]
  - 내보내기 종류: 전체 백업(모든 기록 + 사진) / 분석용(사진 제외) / 최근 30일(기록 + 사진)
  - 파일 하나(.html): 휴대폰 브라우저로 열면 표로 정리된 보고서
      요약, 날짜별 점수, 예측·검증(분석 글 포함), 백테스트 기법별 요약, 백테스트, 영상 공부, 운동 기록
    (사진은 눌러서 크게), 날짜는 'YYYY-MM-DD HH:MM'
  - 복원용 데이터는 같은 파일의 <script type="application/json" id="tn-backup">에 들어 있음
    { app, version, exportedAt, kind: full|nophoto|recent, from, data: { 저장소별 배열, photos[dataUrl] } }
  - 가져오기: .html(위 데이터) 또는 예전 .json 백업. 전체 백업만 '덮어쓰기' 가능,
    분석용·최근 30일은 '합치기'만 가능. 전체 백업을 내보낼 때만 '마지막 백업 시각'을 갱신

  [집계 기준]
  - 예측 점수 통계·기록 기간은 검증한 시각 기준. '이번 주'는 월요일 0시부터.
  - 점수가 있는 검증 완료 예측만 예측 점수 통계에 집계 (취소·대기 예측은 제외).

  [알람 한계]
  서버 없는 웹앱은 브라우저가 닫혀 있으면 알람을 울릴 수 없다.
  앱 밖 알람은 휴대폰 캘린더(.ics)·구글 캘린더 일정, 12시간 이내는 시계 앱 직접 설정 안내로 대신.

  [두 가지 실행 방식]
  - 파일 버전: 이 index.html을 휴대폰 브라우저로 열기
  - 링크 버전: 이 파일에서 html/head/body 껍데기를 벗겨 claude.ai 링크 페이지로 게시
    (window.claude.use 가 있으면 링크 버전으로 판단). 두 버전의 기록은 따로 저장되며
    백업 파일로 옮긴다. 링크 버전의 파일 저장은 downloads 기능(저장 확인 창)을 쓴다.

  [데이터 구조 - IndexedDB 'chartPredictionJournal' v2]
  symbols(id) / predictions(id) / reviews(predictionId) / photos(id, Blob) / settings(key='main')
  techniques(id, name, order) / backtests(id, techniqueId, result: win|loss, symbolId, timeframe,
    photoIds, explainPhotoIds, reason, createdAt, updatedAt)
  videos(id, url, title, note, createdAt, updatedAt)
  exercises(id, name, points, link, order, active) / exerciseLogs(id, exerciseId, day, memo, createdAt)
  groups 저장소는 v0.1.0에서 만든 것으로, 지우지 않고 사용하지 않는다.
  예측: id, symbolId, timeframe, photoIds, memo(분석 글), createdAt, expectedAt, calendarAdded, status
  검증: predictionId, score(1~5), resultPhotoIds, reason, reviewedAt, updatedAt
  사진 구분(kind): analysis(예측) / result(지금 차트) / backtest(기본 차트) / btexplain(설명 차트)
  예측 상태: waiting(대기중) → due(확인 필요) → done(검증 완료) / canceled(취소)
  설정: mandatorySymbolIds, scores, dailyGoal, lastNightRemind, lastBt(마지막 백테스트 선택),
    exSeeded·exVersion(기본 운동 항목을 넣었는지·몇 번째 기본 목록인지),
    mandatoryEdited(필수 종목을 직접 고른 적 있는지) 등. 새로 생긴 값은 시작할 때 기본값으로 채운다.

    - 추가: 백테스트 탭·등록(저장하고 다음)·기법 화면·상세·수정·삭제 (6단계)
    - 추가: 영상 공부 기록·목록, 운동 항목·완료·메모·추천 영상, 오늘 화면 카드 (7단계)
    - 추가: 통계 '훈련'(날짜별 점수·연속 달성·미션 달성률·기법별 성공률·운동 횟수) (8단계)
    - 변경: 내보내기·가져오기를 HTML 파일로 (표로 보는 보고서 + 복원 데이터), 내보내기 종류 3가지
    - 변경: 사진 정리에 백테스트 사진 포함, 저장 공간에 백테스트 사진 표시
    - 변경: + 버튼이 화면에 따라 예측·백테스트·영상 선택, 종목 삭제 시 백테스트 기록도 확인
  v0.7.0 (2026-11-01) 5단계 - 트레이딩 훈련 노트로 확장 시작
    - 변경: 앱 이름 '트레이딩 훈련 노트'
    - 변경: 하단 탭 오늘·예측·백테스트·통계·설정 (홈+기록 → 예측 탭의 진행 중/검증 완료)
    - 추가: 오늘 화면 (점수판, 필수 종목 체크, 확인 필요, 오후 9시 알림)
    - 추가: 점수 계산·연속 달성일, 설정의 필수 종목·점수 기준·하루 목표
    - 추가: 12시간 이내 예측 '휴대폰 알람' 안내 (갤럭시)
    - 변경: IndexedDB v2 (새 저장소 5개), 백업에 새 저장소 포함
  v0.6.0 (2026-10-28)
    - 변경: 등록 시간대에서 1분 제외 (예전 1분 기록은 유지, 기본 시간대가 1분이면 5분으로)
    - 추가: 겹쳐서 비교 자동 맞춤 (같은 캔들 위치끼리), 직접 맞추기(이동·가로/세로 크기)
  v0.5.0 (2026-10-28) 4단계
    - 추가: 링크 버전 지원 (화면 안 확인창, downloads 기능으로 백업 저장, 구글 캘린더 링크)
    - 추가: 연속 등록 ('저장하고 다른 시간대 추가')
    - 추가: 겹쳐서 비교 화면 (밀어 보기·겹쳐 보기)
    - 추가: 저장 공간 표시, 오래된 사진 정리, 취소된 예측 모두 삭제, 저장 공간 경고
    - 변경: alert·confirm을 모두 화면 안 창으로 교체
  v0.4.0 (2026-10-28) 3단계
    - 추가: 기록 화면 (검증 완료 목록, 기간·종목·시간대·점수 필터, 건수·평균 점수)
    - 추가: 통계 화면 (요약, 점수 분포, 종목별·시간대별 평균 점수, 기록 화면 연결)
  v0.3.0 (2026-10-28) 2단계
    - 추가: 등록 화면 종목 버튼 옆 입력칸으로 새 종목 추가 (계속 남음)
    - 추가: 캘린더(.ics) 알람, 앱 내부 알람(소리·진동·알림 창·시스템 알림), 알람 설정
    - 추가: 검증 화면 (예측 사진·지금 사진 위아래 비교, 1~5점, 이유 분석), 검증 수정
  v0.2.0 (2026-10-28) 입력 간소화 재작성 (1단계)
    - 삭제: 가격, 목표가(범위), 무효화 가격, 현재 국면, 전망, 근거 메모·태그,
            시간대 여러 개 묶음 등록
    - 변경: 등록을 종목·시간대·사진·예정 시간 4가지로 줄임, 사진 필수
    - 수정: 사진 첨부가 안 되던 문제 → 투명 입력을 덮는 방식, 압축 실패 시 원본 저장
  v0.1.0 (2026-10-28) 최초 작성 - 1단계 기능 구현
================================================================================

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>트레이딩 훈련 노트</title>
<style>
:root{
  --bg:#0f1115;--card:#181b22;--card2:#1f232c;--line:#2a2f3a;--text:#e8eaed;--muted:#9aa0aa;
  --accent:#f5b301;--danger:#ef4444;
  --s5:#16a34a;--s4:#65a30d;--s3:#d97706;--s2:#ea580c;--s1:#6b7280;
  --c-review:#60a5fa;--c-video:#a78bfa;--c-ex:#f472b6;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;overflow-x:hidden}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-height:44px}
textarea{min-height:110px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;min-height:52px}
.topbar h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .ver{font-size:11px;color:var(--muted)}
.backbtn{background:none;border:none;font-size:22px;padding:0 8px 0 0;min-width:36px;min-height:36px;display:none}
main{padding:12px 16px calc(96px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:#12151b;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;background:none;border:none;padding:10px 0 8px;min-height:56px;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabbar button .ic{font-size:19px;line-height:1}
.tabbar button.on{color:var(--accent)}
.fab{position:fixed;right:18px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:21;width:58px;height:58px;border-radius:50%;border:none;background:var(--accent);color:#111;font-size:30px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.45)}
.hidden{display:none!important}
.section-title{font-size:13px;color:var(--muted);margin:18px 2px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.label{font-size:13px;color:var(--muted);margin:16px 0 8px;display:flex;justify-content:space-between;align-items:center}
.label:first-child{margin-top:0}
.step{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--card2);border:1px solid var(--line);font-size:11px;margin-right:6px;color:var(--text)}
.step.ok{background:var(--accent);border-color:var(--accent);color:#111;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:9px 16px;min-height:44px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#111;font-weight:700}
/* 종목 버튼 옆 새 종목 입력칸 */
.symadd{display:inline-flex;align-items:center;border:1px dashed var(--muted);border-radius:999px;min-height:44px;padding:0 4px 0 12px;flex:1 1 150px;max-width:100%}
.symadd input{border:none;background:transparent;min-height:40px;padding:0;min-width:0;flex:1;font-size:14px}
.symadd button{border:none;background:var(--card2);border-radius:999px;min-width:36px;min-height:36px;font-size:18px;color:var(--accent)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.opt{background:var(--card2);border:1px solid var(--line);border-radius:10px;min-height:44px;padding:6px 2px;font-size:14px}
.opt.on{background:var(--accent);border-color:var(--accent);color:#111;font-weight:700}
.score{min-height:56px;font-size:20px;font-weight:700}
.score.on.s5{background:var(--s5);border-color:var(--s5);color:#fff}
.score.on.s4{background:var(--s4);border-color:var(--s4);color:#fff}
.score.on.s3{background:var(--s3);border-color:var(--s3);color:#fff}
.score.on.s2{background:var(--s2);border-color:var(--s2);color:#fff}
.score.on.s1{background:var(--s1);border-color:var(--s1);color:#fff}
.scorelbl{text-align:center;font-size:14px;margin-top:8px;min-height:20px}
.btn{border:none;border-radius:12px;min-height:48px;padding:0 16px;font-weight:600;background:var(--card2);border:1px solid var(--line)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#111}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn.small{min-height:36px;padding:0 12px;font-size:13px;border-radius:9px}
.wide{width:100%}
.btnrow{display:flex;gap:8px;margin-top:12px}
.btnrow .btn{flex:1}
.hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
.warn{font-size:12px;color:var(--accent);margin-top:6px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--card2);border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.x{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;border:none;background:rgba(0,0,0,.7);color:#fff;font-size:15px;z-index:2}
.addph{display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--muted);font-size:12px;border-style:dashed;text-align:center}
.addph span{font-size:26px;line-height:1.2}
.addph.big{grid-column:1/-1;aspect-ratio:auto;min-height:150px;font-size:14px;border-color:var(--accent);color:var(--accent)}
.addph.big span{font-size:34px}
.addph.bar{aspect-ratio:auto;min-height:56px;flex-direction:row;gap:8px;font-size:14px}
.addph.bar span{font-size:20px}
/* 숨김(display:none) 대신 투명 입력을 덮어서 휴대폰 브라우저·앱 내 미리보기에서도 눌리게 함 */
.addph input[type=file]{position:absolute;inset:0;width:100%;height:100%;min-height:0;opacity:0;padding:0;border:none;cursor:pointer;z-index:1}
.bigph{display:flex;flex-direction:column;gap:8px}
.bigph .one{position:relative}
.bigph img{width:100%;border-radius:10px;border:1px solid var(--line);display:block}
.cmp-tag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--card2);border:1px solid var(--line)}
.pcard{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:9px;align-items:center}
.pcard.due{border-color:var(--danger);background:#2a1517}
.pcard.muted{opacity:.55}
.thumb{width:64px;height:64px;border-radius:9px;object-fit:cover;background:var(--card2);border:1px solid var(--line);flex:none}
.thumb.none{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px}
.pinfo{flex:1;min-width:0}
.prow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.prow+.prow{margin-top:6px}
.sym{font-weight:700;font-size:16px}
.badge{font-size:12px;padding:3px 8px;border-radius:6px;background:var(--card2);border:1px solid var(--line);color:var(--muted)}
.badge.st-due{background:var(--danger);color:#fff;border-color:var(--danger)}
.sb{font-size:13px;font-weight:700;padding:3px 9px;border-radius:6px;color:#fff}
.sb.s5{background:var(--s5)}.sb.s4{background:var(--s4)}.sb.s3{background:var(--s3)}.sb.s2{background:var(--s2)}.sb.s1{background:var(--s1)}
.right{margin-left:auto;font-size:13px}
.alert{color:var(--danger);font-weight:700}
.sub{font-size:12px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:48px 16px;line-height:1.7}
.banner .btn{white-space:nowrap;flex:none}
.banner{background:#2b2410;border:1px solid #5a4710;color:#f3d27a;border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.kv{display:grid;grid-template-columns:80px 1fr;gap:9px 10px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.memo{white-space:pre-wrap;line-height:1.6;font-size:14px}
.symrow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.symrow:last-child{border-bottom:none}
.symrow .nm{flex:1;min-width:0}
.symrow .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{background:var(--card2);border:1px solid var(--line);border-radius:9px;min-width:38px;min-height:38px;padding:0 9px;font-size:13px}
details.fold summary{color:var(--muted);font-size:13px;padding:10px 2px;cursor:pointer}
.hscroll{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .chip{flex:none}
.grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.sumrow{display:flex;justify-content:space-between;align-items:center;font-size:14px;margin:4px 2px 10px}
.reason1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center}
.stat b{display:block;font-size:22px;margin-bottom:2px}
.brow{display:grid;grid-template-columns:64px 1fr 96px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.brow:last-child{border-bottom:none}
.brow.w{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 96px}
.brow.click{cursor:pointer}
.brow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .v{text-align:right;font-size:13px;white-space:nowrap}
.bar{height:10px;background:var(--card2);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.scorecard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 14px;margin-bottom:12px}
.scorecard .big{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.scorecard .big b{font-size:40px;line-height:1;font-variant-numeric:tabular-nums;color:var(--accent)}
.scorecard .big span{font-size:15px;color:var(--muted)}
.scorecard .streak{margin-left:auto;font-size:13px;text-align:right;color:var(--muted)}
.scorecard .streak b{display:block;font-size:20px;color:var(--text)}
.goalbar{height:12px;background:var(--card2);border-radius:6px;overflow:hidden;margin:12px 0 8px}
.goalbar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.goalbar.done i{background:var(--s5)}
.mrow{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:3px 0}
.mrow b{color:var(--text);font-variant-numeric:tabular-nums}
.mand{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mand button{display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--line);border-radius:12px;min-height:56px;padding:8px 12px;text-align:left}
.mand button .ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);flex:none;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.mand button.ok{border-color:var(--s5);background:rgba(22,163,74,.12)}
.mand button.ok .ck{background:var(--s5);border-color:var(--s5);color:#fff}
.mand button .nm{flex:1;min-width:0;font-weight:700;font-size:15px}
.mand button .nm small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.soon{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.soon div{background:var(--card2);border:1px dashed var(--line);border-radius:12px;padding:12px 8px;text-align:center;font-size:13px;color:var(--muted)}
.soon b{display:block;font-size:15px;color:var(--text);margin-bottom:2px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-size:18px}
.stepper b{min-width:34px;text-align:center;font-variant-numeric:tabular-nums}
.srow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.srow:last-child{border-bottom:none}
.srow .t{flex:1;min-width:0}
.rb{font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;color:#fff}
.rb.win{background:var(--s5)}.rb.loss{background:var(--danger)}
.opt.res.win.on{background:var(--s5);border-color:var(--s5);color:#fff}
.opt.res.loss.on{background:var(--danger);border-color:var(--danger);color:#fff}
.exrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.exrow:last-child{border-bottom:none}
.exbtn{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:none;padding:6px 0;min-height:48px;text-align:left}
.exbtn .ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);flex:none;display:flex;align-items:center;justify-content:center;font-weight:700}
.exrow.ok .ck{background:var(--c-ex);border-color:var(--c-ex);color:#111}
.exbtn .nm{flex:1;min-width:0;font-size:15px;font-weight:600}
.exbtn .nm small{display:block;font-weight:400;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
a.iconbtn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--text)}
.vt{flex:1;min-width:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  <button data-tab="today" onclick="App.tab('today')"><span class="ic">◎</span>오늘</button>
  <button data-tab="pred" onclick="App.tab('home')"><span class="ic">⌂</span>예측</button>

<div id="modalRoot"></div>
<div id="dialogRoot"></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* =========================== 상수 =========================== */
const VERSION = 'v1.2.1';
const APP_ID = 'chart-prediction-journal';
const DB_NAME = 'chartPredictionJournal';
const DB_VER = 2;   // v0.7.0: 백테스트·영상·운동 저장소 추가
// 등록할 때 고르는 시간대 (v0.6.0부터 1분 제외)
const TIMEFRAMES = ['5분','10분','15분','30분','1시간','2시간','4시간','6시간','8시간','일','주'];
// 기록·통계 정렬용 (예전 1분 기록도 순서대로 보이게)
const ALL_TIMEFRAMES = ['1분', '3분', ...TIMEFRAMES];   // 백테스트 시간대(1분·3분 포함), 기록·통계 정렬용
const STATUS = { waiting: '대기중', due: '확인 필요', done: '검증 완료', canceled: '취소됨' };
const SCORES = { 5: '완전히 맞음', 4: '대부분 맞음', 3: '반쯤 맞음', 2: '대부분 틀림', 1: '완전히 틀림' };
const CATEGORIES = ['해외선물','코인','지수','국내주식'];
const QUICK_TIMES = [{ l: '15분 후', m: 15 }, { l: '30분 후', m: 30 }, { l: '1시간 후', m: 60 }, { l: '4시간 후', m: 240 }, { l: '내일', m: 1440 }];
const CAL_MODES = { ask: '매번 묻기', always: '항상 추가', never: '추가 안 함' };
const DEFAULT_SYMBOLS = [
  { name: '골드', category: '해외선물' },
  { name: '나스닥', category: '해외선물' },
  { name: '비트코인', category: '코인' },
  { name: '코스피', category: '지수' }
];
const BACKUP_REMIND_MS = 7 * 24 * 60 * 60 * 1000;
const TICK_MS = 15000;
const PERIODS = { today: '오늘', week: '이번 주', month: '이번 달', all: '전체' };
const REC_PAGE = 30;
// 링크 버전(claude.ai 링크 페이지) 여부: 그곳에서는 window.claude.use 가 먼저 있음
const IN_LINK = !!(window.claude && typeof window.claude.use === 'function');

/* =========================== IndexedDB =========================== */
let db;
function openDB() {
  return new Promise((resolve, reject) => {
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains('symbols')) d.createObjectStore('symbols', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('groups')) d.createObjectStore('groups', { keyPath: 'id' });   // v0.1.0 호환용
      if (!d.objectStoreNames.contains('predictions')) {
        const s = d.createObjectStore('predictions', { keyPath: 'id' });
        s.createIndex('groupId', 'groupId');
        s.createIndex('status', 'status');
      }
      if (!d.objectStoreNames.contains('reviews')) d.createObjectStore('reviews', { keyPath: 'predictionId' });
      if (!d.objectStoreNames.contains('photos')) d.createObjectStore('photos', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('settings')) d.createObjectStore('settings', { keyPath: 'key' });
      // v2: 저장소만 추가 (기존 기록은 건드리지 않음)
      ['techniques', 'backtests', 'videos', 'exercises', 'exerciseLogs'].forEach(n => {
        if (!d.objectStoreNames.contains(n)) d.createObjectStore(n, { keyPath: 'id' });
      });
    };
    r.onsuccess = () => { db = r.result; resolve(); };
    r.onerror = () => reject(r.error);
  });
}
const STORES = ['symbols','groups','predictions','reviews','photos','settings','techniques','backtests','videos','exercises','exerciseLogs'];
// 백업에 들어가는 기록 저장소 (사진·설정은 따로 처리)
const DATA_STORES = ['symbols','groups','predictions','reviews','techniques','backtests','videos','exercises','exerciseLogs'];
function reqP(r) { return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
const getAll = s => reqP(db.transaction(s).objectStore(s).getAll());
const getOne = (s, k) => reqP(db.transaction(s).objectStore(s).get(k));
const putOne = (s, v) => reqP(db.transaction(s, 'readwrite').objectStore(s).put(v));
// 여러 저장소를 한 트랜잭션으로 처리 (중간 실패 시 전체 취소)
function writeMany(ops) {
  return new Promise((res, rej) => {
    if (!ops.length) return res();
    const names = [...new Set(ops.map(o => o.store))];
    const t = db.transaction(names, 'readwrite');
    ops.forEach(o => {
      const s = t.objectStore(o.store);
      if (o.type === 'clear') s.clear();
      else if (o.type === 'delete') s.delete(o.key);
      else s.put(o.value);
    });
    t.oncomplete = () => res();
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error || new Error('저장 실패'));
  });
}

/* =========================== 유틸 =========================== */
const $ = id => document.getElementById(id);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const WD = ['일','월','화','수','목','금','토'];
function fmtDate(ms) {
  if (!ms) return '-';
  const d = new Date(ms), y = d.getFullYear() !== new Date().getFullYear() ? d.getFullYear() + '/' : '';
  return `${y}${d.getMonth() + 1}/${d.getDate()}(${WD[d.getDay()]}) ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function toLocalInput(ms) {
  const d = new Date(ms);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function fromLocalInput(s) { if (!s) return null; const t = new Date(s).getTime(); return isNaN(t) ? null : t; }
function relTime(ms) {
  const diff = ms - Date.now();
  const past = diff < 0;
  const m = Math.floor(Math.abs(diff) / 60000);
  const d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), mm = m % 60;
  let s = d ? `${d}일 ${h}시간` : h ? `${h}시간 ${mm}분` : mm ? `${mm}분` : '1분 미만';
  return past ? `${s} 지남` : `${s} 남음`;
}
function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2400);
}
function stamp() { const d = new Date(); return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`; }
function downloadBlob(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 3000);
}
// 화면 안 확인·안내 창 (링크 페이지는 alert·confirm이 막혀 있어서 전부 이것으로)
let dialogResolve = null;
function uiDialog(html) {
  if (dialogResolve) closeDialog(false);
  return new Promise(res => {
    dialogResolve = res;
    $('dialogRoot').innerHTML = `<div class="modal-bg dlg"><div class="modal">${html}</div></div>`;
  });
}
function closeDialog(v) {
  $('dialogRoot').innerHTML = '';
  const r = dialogResolve; dialogResolve = null;
  if (r) r(v);
}
function uiAlert(msg) {
  return uiDialog(`<div class="dlgmsg">${esc(msg)}</div><div class="btnrow"><button class="btn primary" onclick="App.dlg(true)">확인</button></div>`);
}
function uiConfirm(msg, okLabel, danger) {
  return uiDialog(`<div class="dlgmsg">${esc(msg)}</div><div class="btnrow"><button class="btn" onclick="App.dlg(false)">취소</button><button class="btn ${danger ? 'danger' : 'primary'}" onclick="App.dlg(true)">${esc(okLabel || '확인')}</button></div>`);
}
// 파일 저장: 링크 버전은 downloads 기능(저장 확인 창), 파일 버전은 일반 다운로드
async function saveFile(data, name) {
  if (IN_LINK) {
    let dl = null;
    try { dl = await window.claude.use('downloads'); } catch (e) {}
    if (dl) {
      try { await dl.save({ filename: name, data }); return true; }
      catch (e) {
        if (e && e.code === 'declined') { toast('저장을 취소했어요'); return false; }
        if (e && e.code === 'rate_limited') { toast('저장 창이 이미 열려 있어요'); return false; }
        uiAlert('파일을 저장하지 못했어요.\n' + ((e && e.message) || ''));
        return false;
      }
    }
  }
  downloadBlob(data instanceof Blob ? data : new Blob([data]), name);
  return true;
}
const mb = n => n == null ? '-' : (n / 1048576 >= 1024 ? (n / 1073741824).toFixed(2) + 'GB' : (n / 1048576).toFixed(1) + 'MB');
function symName(id) { const s = symMap[id]; return s ? s.name : '(삭제된 종목)'; }
function predLine(p) { return `${symName(p.symbolId)} ${p.timeframe}`; }
function scoreBadge(r) { return r && r.score ? `<span class="sb s${r.score}">${r.score}점</span>` : ''; }

/* =========================== 사진 =========================== */
// 이미지 읽기: createImageBitmap 우선, 안 되면 <img>로 시도
async function loadImage(file) {
  if (window.createImageBitmap) {
    try { const bm = await createImageBitmap(file); return { w: bm.width, h: bm.height, src: bm }; } catch (e) {}
  }
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => {
      const im = new Image();
      const t = setTimeout(() => rej(new Error('시간 초과')), 15000);
      im.onload = () => { clearTimeout(t); res(im); };
      im.onerror = () => { clearTimeout(t); rej(new Error('이미지를 읽지 못함')); };
      im.src = url;
    });
    return { w: img.naturalWidth, h: img.naturalHeight, src: img, url };
  } catch (e) { URL.revokeObjectURL(url); throw e; }
}
// 사진 압축: 긴 변 1280px(백테스트는 1080px), JPEG 0.85. 실패하면 원본 그대로 저장
async function compressImage(file, maxSide = 1280) {
  let im;
  try { im = await loadImage(file); } catch (e) { return file; }
  try {
    const r = Math.min(1, maxSide / Math.max(im.w, im.h));
    const w = Math.max(1, Math.round(im.w * r)), h = Math.max(1, Math.round(im.h * r));
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    cv.getContext('2d').drawImage(im.src, 0, 0, w, h);
    let blob = await new Promise(res => { try { cv.toBlob(b => res(b), 'image/jpeg', 0.85); } catch (e) { res(null); } });
    if (!blob) { try { blob = dataURLToBlob(cv.toDataURL('image/jpeg', 0.85)); } catch (e) { blob = null; } }
    return blob || file;
  } catch (e) {
    return file;
  } finally {
    if (im.url) URL.revokeObjectURL(im.url);
    if (im.src && im.src.close) im.src.close();
  }
}
function blobToDataURL(blob) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); });
}
function dataURLToBlob(dataUrl) {
  const [head, b64] = dataUrl.split(',');
  const mime = (head.match(/data:([^;]+)/) || [])[1] || 'image/jpeg';
  const bin = atob(b64), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}
// 저장된 사진 표시용 URL 캐시
const photoUrls = new Map();
function photoUrl(photo) {
  if (!photoUrls.has(photo.id)) photoUrls.set(photo.id, URL.createObjectURL(photo.blob));
  return photoUrls.get(photo.id);
}
// 파일 선택 → 압축 → 목록 반환
async function readPhotoFiles(input, maxSide) {
  const files = Array.from(input.files || []);
  try { input.value = ''; } catch (e) {}
  const out = [];
  if (!files.length) return out;
  toast(`사진 ${files.length}장 처리 중…`);
  for (const f of files) {
    try {
      const blob = await compressImage(f, maxSide || 1280);
      out.push({ blob, url: URL.createObjectURL(blob), isNew: true });
    } catch (e) { await uiAlert('사진을 읽지 못했어요: ' + (f.name || '')); }
  }
  if (out.length) toast(`사진 ${out.length}장 추가`);
  return out;
}
async function loadPhotos(ids) {
  const out = [];
  for (const id of (ids || [])) { const ph = await getOne('photos', id); if (ph) out.push(ph); }
  return out;
}
function bigPhotos(list) {
  return `<div class="bigph">${list.map(ph => `<img src="${photoUrl(ph)}" onclick="App.viewImg('${photoUrl(ph)}')" alt="">`).join('')}</div>`;
}

/* =========================== 상태 =========================== */
let S = null;            // 설정
let symbols = [];        // 종목 목록 (순서대로)
let symMap = {};
let view = 'today', params = {}, stack = [];
let form = null;         // 예측 작성 상태
let rv = null;           // 검증 작성 상태
let skipLeaveConfirm = false;
let pendingImport = null;

const DEFAULT_SCORES = { mandatory: 5, review: 2, backtest: 1, backtestGoal: 20, backtestBonus: 5, videoFirst: 5, videoMore: 2 };
const DEFAULT_GOAL = 60;
const MANDATORY_NAMES = ['골드', '나스닥', '비트코인', '코스피'];
function defaultSettings() {
  return { key: 'main', seeded: false, defaultTimeframe: '15분', lastBackup: null, lastSymbolId: null,
    calendarMode: 'ask', alarmSound: true, alarmVibrate: true,
    mandatorySymbolIds: null, scores: { ...DEFAULT_SCORES }, dailyGoal: DEFAULT_GOAL, lastNightRemind: '' };
}
async function loadSettings() {
  const saved = await getOne('settings', 'main');
  S = { ...defaultSettings(), ...(saved || {}) };
  S.scores = { ...DEFAULT_SCORES, ...(S.scores || {}) };   // 새로 생긴 점수 항목은 기본값으로
  if (!TIMEFRAMES.includes(S.defaultTimeframe)) S.defaultTimeframe = '5분';   // 1분이 빠져서 기본값 조정   // 이전 버전 설정은 두고 빠진 값만 기본값으로 채움
}
const saveSettings = () => putOne('settings', S);
// 이름이 같은 항목이 여러 개면 하나로 합침 (백업 '합치기' 등으로 생긴 중복).
// 기록이 가장 많은 항목을 남기고, 다른 항목을 가리키던 기록은 남긴 항목으로 옮김. 돌려주는 값: { 지운 id: 남긴 id }
async function dedupeByName(store, refs, filter) {
  const items = (await getAll(store)).filter(filter || (() => true));
  const groups = {};
  items.forEach(x => { const k = (x.name || '').trim(); if (k) (groups[k] = groups[k] || []).push(x); });
  const dups = Object.values(groups).filter(g => g.length > 1);
  if (!dups.length) return {};
  const refData = {};
  for (const r of refs) if (!refData[r.store]) refData[r.store] = await getAll(r.store);
  const count = id => refs.reduce((n, r) => n + refData[r.store].filter(x => x[r.field] === id).length, 0);
  const map = {}, ops = [];
  dups.forEach(g => {
    g.sort((a, b) => count(b.id) - count(a.id) || (a.order || 0) - (b.order || 0));
    g.slice(1).forEach(x => { map[x.id] = g[0].id; ops.push({ store, type: 'delete', key: x.id }); });
    const minOrder = Math.min(...g.map(x => x.order || 0));   // 남긴 항목은 가장 앞 순서 자리로
    if ((g[0].order || 0) !== minOrder) ops.push({ store, type: 'put', value: { ...g[0], order: minOrder } });
  });
  refs.forEach(r => refData[r.store].forEach(rec => {
    if (map[rec[r.field]]) ops.push({ store: r.store, type: 'put', value: { ...rec, [r.field]: map[rec[r.field]] } });
  }));
  await writeMany(ops);
  return map;
}
async function loadSymbols() {
  const map = await dedupeByName('symbols', [{ store: 'predictions', field: 'symbolId' }, { store: 'backtests', field: 'symbolId' }]);
  symbols = (await getAll('symbols')).sort((a, b) => a.order - b.order);
  symMap = Object.fromEntries(symbols.map(s => [s.id, s]));
  let changed = false;
  if (map[S.lastSymbolId]) { S.lastSymbolId = map[S.lastSymbolId]; changed = true; }
  if (S.lastBt && map[S.lastBt.symbolId]) { S.lastBt = { ...S.lastBt, symbolId: map[S.lastBt.symbolId] }; changed = true; }
  // 필수 종목: 합친 종목 번호로 바꾸고, 없는 종목은 뺌
  if (Array.isArray(S.mandatorySymbolIds)) {
    const valid = [...new Set(S.mandatorySymbolIds.map(id => map[id] || id).filter(id => symMap[id]))];
    if (valid.join() !== S.mandatorySymbolIds.join()) { S.mandatorySymbolIds = valid; changed = true; }
  }
  // 아직 정해지지 않았거나, 사용자가 직접 끈 적 없이 비어 버렸으면 기본 4종목을 이름으로 찾아 지정
  if (!Array.isArray(S.mandatorySymbolIds) || (!S.mandatorySymbolIds.length && !S.mandatoryEdited)) {
    S.mandatorySymbolIds = MANDATORY_NAMES.map(n => (symbols.find(x => x.name === n) || {}).id).filter(Boolean);
    changed = true;
  }
  if (changed) await saveSettings();
}
function mandatoryList() { return (S.mandatorySymbolIds || []).filter(id => symMap[id]).sort((a, b) => symMap[a].order - symMap[b].order); }
async function seedIfNeeded() {

}

async function addSymbolByName(name, category) {

// 한국 시간(휴대폰 시간) 기준 날짜 키 'YYYY-MM-DD'
function dayKey(ms) { const d = new Date(ms); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function addDays(key, n) { const [y, m, d] = key.split('-').map(Number); return dayKey(new Date(y, m - 1, d + n).getTime()); }
// 날짜별 점수 계산 (기록에서 계산, 저장하지 않음)
async function dayStats() {
  const ps = await getAll('predictions'), rs = await getAll('reviews');
  const bts = await getAll('backtests'), vids = await getAll('videos'), logs = await getAll('exerciseLogs'), exs = await getAll('exercises');
  const exMap = Object.fromEntries(exs.map(e => [e.id, e]));
  const mand = mandatoryList(), sc = S.scores, days = {};
  const D = k => days[k] || (days[k] = { mandDone: new Set(), reviews: 0, backtests: 0, videos: 0, videoOk: 0, exPts: 0, exDone: new Set() });
  ps.forEach(p => { if (p.status !== 'canceled' && mand.includes(p.symbolId)) D(dayKey(p.createdAt)).mandDone.add(p.symbolId); });
  rs.forEach(r => { if (r.score && r.reviewedAt) D(dayKey(r.reviewedAt)).reviews++; });
  bts.forEach(b => D(dayKey(b.createdAt)).backtests++);
  vids.forEach(v => { const d = D(dayKey(v.createdAt)); d.videos++; if ((v.note || '').trim().length >= 30) d.videoOk++; });
  logs.forEach(l => { const d = D(l.day); if (!d.exDone.has(l.exerciseId)) { d.exDone.add(l.exerciseId); d.exPts += (exMap[l.exerciseId] || {}).points || 0; } });
  const scoreOf = k => {
    const d = days[k];
    if (!d) return { total: 0, parts: { mandatory: 0, review: 0, backtest: 0, video: 0, exercise: 0 }, d: D(k), complete: mand.length > 0 && false };
    const parts = {
      mandatory: d.mandDone.size * sc.mandatory,
      review: d.reviews * sc.review,
      backtest: d.backtests * sc.backtest + (d.backtests >= sc.backtestGoal ? sc.backtestBonus : 0),
      video: d.videoOk ? sc.videoFirst + (d.videoOk - 1) * sc.videoMore : 0,
      exercise: d.exPts
    };
    return { total: Object.values(parts).reduce((a, b) => a + b, 0), parts, d, complete: mand.length > 0 && mand.every(id => d.mandDone.has(id)) };
  };
  const complete = k => { const d = days[k]; return !!d && mand.length > 0 && mand.every(id => d.mandDone.has(id)); };
  // 연속 달성일: 오늘을 끝낸 상태면 오늘부터, 아직이면 어제부터 거꾸로 셈
  const today = dayKey(Date.now());
  let k = complete(today) ? today : addDays(today, -1), streak = 0;
  while (complete(k) && streak < 3650) { streak++; k = addDays(k, -1); }
  const firstDay = Object.keys(days).filter(x => x <= today).sort()[0] || today;   // 기록이 시작된 날
  return { scoreOf, complete, streak, today, ps, firstDay };
}

  const canceled = ps.filter(p => p.status === 'canceled').sort((a, b) => b.expectedAt - a.expectedAt);
  let h = predSeg('home');
  if (due.length) {
    h += `<div class="section-title"><span>확인 필요 ${due.length}</span><span>눌러서 검증</span></div>`;
    h += await cardsHtml(due, rmap);
  }
  h += `<div class="section-title"><span>대기중 ${waiting.length}</span></div>`;
  if (waiting.length) h += await cardsHtml(waiting, rmap);
  else if (!due.length && !done.length) h += `<div class="empty">대기중인 예측이 없어요.<br>오른쪽 아래 <b>+</b> 버튼으로 예측을 등록하세요.</div>`;
  else h += `<div class="sub" style="padding:4px 2px 8px">대기중인 예측이 없어요.</div>`;
  if (done.length) h += `<details class="fold"><summary>최근 검증 완료 ${done.length}</summary>${await cardsHtml(done, rmap)}</details>`;
  if (canceled.length) h += `<details class="fold"><summary>취소된 예측 ${canceled.length}</summary>${await cardsHtml(canceled, rmap)}</details>`;
  $('view').innerHTML = h;
}

async function saveForm(cont) {
  const f = form, errors = [];
  if (!f.symbolId || !symMap[f.symbolId]) errors.push('종목을 선택하세요.');
  if (!f.timeframe) errors.push('시간대를 선택하세요.');
  if (!f.photos.length) errors.push('사진을 1장 이상 첨부하세요.');
  const exp = fromLocalInput(f.expectedAt);
  if (!exp) errors.push('예정 시간을 정하세요.');
  else if ((f.mode === 'new' || exp !== f.orig.expectedAt) && exp <= Date.now()) errors.push('예정 시간이 이미 지났어요.');
  if (errors.length) { uiAlert(errors.join('\n')); return; }
  const now = Date.now(), ops = [];
  const pid = f.mode === 'edit' ? f.orig.id : uid();
  const photoIds = [];
  f.photos.forEach(ph => {
    if (ph.isNew) {
      const id = uid(); photoIds.push(id);
      ops.push({ store: 'photos', type: 'put', value: { id, blob: ph.blob, predictionId: pid, kind: 'analysis', createdAt: now } });
    } else photoIds.push(ph.id);
  });
  f.removedPhotoIds.forEach(id => ops.push({ store: 'photos', type: 'delete', key: id }));
  let calendarReason = null;
  if (f.mode === 'new') {
    ops.push({ store: 'predictions', type: 'put', value: {
      id: pid, symbolId: f.symbolId, timeframe: f.timeframe, photoIds, memo: f.memo.trim(),
      createdAt: now, expectedAt: exp, calendarAdded: false, status: 'waiting', updatedAt: now
    } });
    calendarReason = 'new';
  } else {
    const p = f.orig;
    const status = p.status === 'canceled' || p.status === 'done' ? p.status : (exp > now ? 'waiting' : 'due');
    ops.push({ store: 'predictions', type: 'put', value: { ...p, symbolId: f.symbolId, timeframe: f.timeframe, photoIds, memo: f.memo.trim(), expectedAt: exp, status, updatedAt: now } });
    if (exp !== p.expectedAt && status === 'waiting') calendarReason = 'timeChanged';
  }
  try { await writeMany(ops); }
  catch (e) { uiAlert('저장에 실패했어요. 저장 공간이 부족할 수 있어요.\n' + (e && e.message ? e.message : '')); return; }
  S.lastSymbolId = f.symbolId; await saveSettings();
  if (cont && f.mode === 'new') {
    // 연속 등록: 같은 종목·같은 사진으로 새 등록 화면 (사진은 새 예측용으로 다시 저장됨)
    const next = { mode: 'new', symbolId: f.symbolId, timeframe: '', memo: f.memo, expectedAt: '', removedPhotoIds: [], dirty: false,
      photos: f.photos.map(ph => ({ blob: ph.blob, url: URL.createObjectURL(ph.blob), isNew: true })),
      calIds: [...(f.calIds || []), pid], savedTfs: [...(f.savedTfs || []), f.timeframe] };
    f.photos.forEach(ph => { if (ph.isNew) URL.revokeObjectURL(ph.url); });
    form = next;
    window.scrollTo(0, 0); renderForm();
    toast(`${f.timeframe} 저장 · 다른 시간대를 고르세요`);
    return;
  }
  const calIds = f.mode === 'new' ? [...(f.calIds || []), pid] : (calendarReason ? [pid] : []);
  f.calIds = [];   // 나갈 때 다시 묻지 않도록 비움
  toast(f.mode === 'edit' ? '수정했어요' : `저장했어요 · ${fmtDate(exp)} 확인`);
  leaveSub();
  if (calendarReason && calIds.length) setTimeout(() => afterSaveCalendar(calIds, calendarReason), 350);
}

/* =========================== 알람 A: 캘린더(.ics) =========================== */
function icsEsc(s) { return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n'); }
function icsDate(ms) { return new Date(ms).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, ''); }
// 한 줄 75바이트 제한에 맞춰 줄 접기 (한글 3바이트 고려)
function icsFold(line) {
  const enc = new TextEncoder(), out = [];
  let cur = '', bytes = 0;
  for (const ch of line) {
    const b = enc.encode(ch).length;
    if (bytes + b > 74) { out.push(cur); cur = ' ' + ch; bytes = 1 + b; }
    else { cur += ch; bytes += b; }
  }
  out.push(cur);
  return out.join('\r\n');
}
function buildICS(preds) {
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//ChartPredictionJournal//KO', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH'];
  preds.forEach(p => {
    lines.push('BEGIN:VEVENT',
      `UID:${p.id}@chart-prediction-journal`,
      `SEQUENCE:${Math.floor((p.updatedAt || p.createdAt) / 1000)}`,
      `DTSTAMP:${icsDate(Date.now())}`,
      `DTSTART:${icsDate(p.expectedAt)}`,
      `DTEND:${icsDate(p.expectedAt + 15 * 60000)}`,
      `SUMMARY:${icsEsc('[예측 확인] ' + predLine(p))}`,
      `DESCRIPTION:${icsEsc(`${predLine(p)} 예측 확인 시간입니다.\n${fmtDate(p.createdAt)}에 등록한 사진과 지금 차트를 비교해 점수를 매기세요.`)}`,
      'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc('예측 확인: ' + predLine(p))}`, 'TRIGGER:PT0M', 'END:VALARM',
      'END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  return lines.map(icsFold).join('\r\n') + '\r\n';
}
// 휴대폰 캘린더(.ics) 파일 - 파일 버전 전용 (링크 페이지는 .ics 저장 불가)
async function addToCalendar(ids) {
  const ps = (await Promise.all(ids.map(id => getOne('predictions', id)))).filter(Boolean);
  if (!ps.length) return;
  closeModal();
  downloadBlob(new Blob([buildICS(ps)], { type: 'text/calendar;charset=utf-8' }), `예측확인_${stamp()}.ics`);
  await markCalendar(ps.map(p => p.id));
  toast('캘린더 파일을 만들었어요. 파일을 열어 캘린더에 추가하세요');
}
async function markCalendar(ids) {
  const ps = (await Promise.all(ids.map(id => getOne('predictions', id)))).filter(Boolean);
  await writeMany(ps.map(p => ({ store: 'predictions', type: 'put', value: { ...p, calendarAdded: true } })));
  if (view === 'detail' && !overlayOpen()) render();
}
// 구글 캘린더 일정 추가 링크 (두 버전 모두 사용 가능)
function gcalUrl(p) {
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE'
    + '&text=' + encodeURIComponent('[예측 확인] ' + predLine(p))
    + '&dates=' + icsDate(p.expectedAt) + '/' + icsDate(p.expectedAt + 15 * 60000)
    + '&details=' + encodeURIComponent(`${fmtDate(p.createdAt)}에 등록한 예측 사진과 지금 차트를 비교해 점수를 매기세요.`);
}
const NEAR_MS = 12 * 3600000;   // 12시간 이내 예측은 휴대폰 알람 안내
const hm = ms => { const d = new Date(ms); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
async function calendarChoice(ids, reason, nearOnlyShown) {
  const all = (await Promise.all(ids.map(id => getOne('predictions', id)))).filter(Boolean).sort((a, b) => a.expectedAt - b.expectedAt);
  if (!all.length) return;
  const now = Date.now();
  const near = nearOnlyShown ? [] : all.filter(p => p.expectedAt - now <= NEAR_MS);
  const ps = nearOnlyShown ? all : all.filter(p => p.expectedAt - now > NEAR_MS);
  if (near.length) {
    const rows = near.map(p => `<div class="calrow"><div class="t"><b>${esc(symName(p.symbolId))}</b> ${esc(p.timeframe)}<br><span class="sub">${fmtDate(p.expectedAt)} · ${relTime(p.expectedAt)}</span></div><span class="alarmbig">${hm(p.expectedAt)}</span></div>`).join('');
    showModal(`<h3>휴대폰 알람 맞추기</h3>
      <div class="hint" style="font-size:14px">12시간 안에 확인할 예측이에요. 시계 앱을 열고 아래 시각으로 알람을 맞추세요.</div>
      ${rows}
      <div class="hint">갤럭시에서는 웹 페이지가 시계 앱에 알람을 직접 넣을 수 없어요. 이 앱이 열려 있으면 그 시각에 앱 알람도 울려요.</div>
      <div class="btnrow">${ps.length ? `<button class="btn primary" onclick="App.calNext(${esc(JSON.stringify(ps.map(p => p.id)))},'${reason}')">다음: 캘린더 ${ps.length}개</button>` : ''}<button class="btn ${ps.length ? '' : 'primary'}" onclick="App.closeModal()">${ps.length ? '닫기' : '확인'}</button></div>`);
    return;
  }
  if (!ps.length) return;
  const msg = reason === 'timeChanged'
    ? '예정 시간이 바뀌었어요. 캘린더 일정을 다시 추가하세요.<br>기존 일정은 캘린더에서 직접 지워주세요.'
    : '앱을 닫아도 예정 시간에 알림을 받으려면 캘린더에 추가하세요.';
  const ics = IN_LINK ? '' : `<button class="btn primary wide" style="margin-top:12px" onclick="App.addToCalendar(${esc(JSON.stringify(ps.map(p => p.id)))})">휴대폰 캘린더에 ${ps.length > 1 ? ps.length + '개 한 번에 ' : ''}추가 (.ics)</button>
    <div class="hint">받은 파일을 열면 휴대폰 캘린더에 일정이 들어가요.</div>`;
  const rows = ps.map(p => `<div class="calrow"><div class="t"><b>${esc(symName(p.symbolId))}</b> ${esc(p.timeframe)}<br><span class="sub">${fmtDate(p.expectedAt)}</span></div>
    <a class="btn small" href="${esc(gcalUrl(p))}" target="_blank" rel="noopener" onclick="App.markCal('${p.id}')">구글 캘린더</a></div>`).join('');
  showModal(`<h3>캘린더에 추가할까요?</h3><div class="hint" style="font-size:14px">${msg}</div>${ics}
    <div class="label" style="margin-top:14px"><span>구글 캘린더에 하나씩 추가</span></div>${rows}
    <div class="hint">구글 캘린더 알림 시각은 구글 캘린더의 기본 알림 설정을 따라요.</div>
    <div class="btnrow"><button class="btn" onclick="App.closeModal()">닫기</button></div>`);
}
async function afterSaveCalendar(ids, reason) {
  // 12시간 이내 예측은 설정과 상관없이 휴대폰 알람 안내를 먼저 보여줌
  const ps = (await Promise.all(ids.map(id => getOne('predictions', id)))).filter(Boolean);
  const nearIds = ps.filter(p => p.expectedAt - Date.now() <= NEAR_MS).map(p => p.id);
  const farIds = ps.filter(p => p.expectedAt - Date.now() > NEAR_MS).map(p => p.id);
  if (S.calendarMode === 'never' || !farIds.length) { if (nearIds.length) calendarChoice(nearIds, reason); return; }
  if (S.calendarMode === 'always' && !IN_LINK) {   // 링크 버전은 자동 저장이 안 되어 창으로 물음
    await addToCalendar(farIds);
    if (nearIds.length) calendarChoice(nearIds, reason);
    return;
  }
  calendarChoice(ids, reason);
}

/* =========================== 알람 B: 앱 내부 알람 =========================== */
let audioCtx = null;
function unlockAudio() {
  try {
    if (!audioCtx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) audioCtx = new AC(); }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) {}
}
document.addEventListener('pointerdown', unlockAudio, { passive: true });   // 휴대폰은 한 번 터치해야 소리가 남
function beep() {
  if (!S.alarmSound || !audioCtx) return;
  try {
    const t0 = audioCtx.currentTime;
    [0, 0.35, 0.7].forEach(d => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, t0 + d);
      g.gain.exponentialRampToValueAtTime(0.4, t0 + d + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 0.28);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t0 + d); o.stop(t0 + d + 0.3);
    });
  } catch (e) {}
}
function vibrate() { if (S.alarmVibrate && navigator.vibrate) { try { navigator.vibrate([300, 150, 300, 150, 300]); } catch (e) {} } }
function systemNotify(p) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  try {
    const n = new Notification('예측 확인 시간', { body: predLine(p), tag: p.id });
    n.onclick = () => { window.focus(); App.alarmGo(p.id); n.close(); };
  } catch (e) {}   // 일부 휴대폰 브라우저는 페이지에서 직접 알림을 띄울 수 없음
}
function fireAlarm(preds) {
  beep(); vibrate();
  preds.forEach(systemNotify);
  const rows = preds.map(p => `<div class="alarmrow"><div class="t"><b>${esc(symName(p.symbolId))}</b> <span class="badge">${esc(p.timeframe)}</span><br><span class="sub">${fmtDate(p.expectedAt)} 예정</span></div><button class="btn small primary" onclick="App.alarmGo('${p.id}')">확인하기</button></div>`).join('');
  showModal(`<h3>⏰ 예측 확인 시간 (${preds.length})</h3>${rows}<div class="btnrow"><button class="btn" onclick="App.closeModal()">나중에</button></div>`);
}
async function tick() {
  const changed = await refreshStatuses();
  if ((view === 'home' || view === 'today') && !overlayOpen()) await render();
  else if (changed.length && view === 'detail') await render();
  if (changed.length && !document.hidden) fireAlarm(changed);
  else if (!document.hidden) nightRemind();
}

/* =========================== 검증 =========================== */
async function startReview(id) {
  const p = await getOne('predictions', id);
  if (!p) return false;
  const r = await getOne('reviews', id);
  const analysis = await loadPhotos(p.photoIds);
  const photos = r ? (await loadPhotos(r.resultPhotoIds)).map(ph => ({ id: ph.id, blob: ph.blob, url: photoUrl(ph), isNew: false })) : [];
  rv = { pred: p, existing: r || null, analysis, photos, removedPhotoIds: [],
    score: r && r.score ? r.score : 0, reason: r ? (r.reason || '') : '', dirty: false };
  return true;
}
function cleanupReview() {
  if (!rv) return;
  rv.photos.forEach(ph => { if (ph.isNew) URL.revokeObjectURL(ph.url); });
  rv = null;
}
function renderReview() {
  if (!rv) { $('view').innerHTML = ''; return; }
  const p = rv.pred;

async function saveReview() {
  const errors = [];
  if (!rv.photos.length) errors.push('지금 차트 사진을 1장 이상 첨부하세요.');
  if (!rv.score) errors.push('예측 점수를 골라주세요.');
  if (errors.length) { uiAlert(errors.join('\n')); return; }
  const now = Date.now(), ops = [];
  const p = await getOne('predictions', rv.pred.id);
  if (!p) { uiAlert('예측을 찾을 수 없어요.'); return; }
  const resultPhotoIds = [];
  rv.photos.forEach(ph => {
    if (ph.isNew) {
      const id = uid(); resultPhotoIds.push(id);
      ops.push({ store: 'photos', type: 'put', value: { id, blob: ph.blob, predictionId: p.id, kind: 'result', createdAt: now } });

  rv.removedPhotoIds.forEach(id => ops.push({ store: 'photos', type: 'delete', key: id }));

}

// 자동 맞춤: 두 스크린샷에서 '열마다 캔들이 있는 높이'를 뽑아 1차원 흐름으로 만들고,
// 가로 배율·가로 이동을 바꿔 가며 두 흐름이 가장 비슷한 자리를 찾는다.
// 세로는 그 자리에서 직선 맞춤(배율·이동)으로 구한다. 시간축 글자는 읽지 않는다.
const ALIGN_W = 480;
function loadImgEl(url) {
  return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('사진을 읽지 못함')); im.src = url; });
}
async function chartSignal(url) {
  const im = await loadImgEl(url);
  const nw = im.naturalWidth, nh = im.naturalHeight, k = ALIGN_W / nw, w = ALIGN_W, h = Math.max(8, Math.round(nh * k));
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const g = cv.getContext('2d', { willReadFrequently: true }); g.drawImage(im, 0, 0, w, h);
  const d = g.getImageData(0, 0, w, h).data;
  // 배경색 = 가장 많은 색
  const hist = new Map();
  for (let i = 0; i < d.length; i += 16) { const key = (d[i] >> 4) << 8 | (d[i + 1] >> 4) << 4 | (d[i + 2] >> 4); hist.set(key, (hist.get(key) || 0) + 1); }
  let bk = 0, bc = -1; hist.forEach((c, key) => { if (c > bc) { bc = c; bk = key; } });
  const R = ((bk >> 8) & 15) * 16 + 8, G = ((bk >> 4) & 15) * 16 + 8, B = (bk & 15) * 16 + 8;
  const on = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = (y * w + x) * 4;
    if (Math.abs(d[i] - R) + Math.abs(d[i + 1] - G) + Math.abs(d[i + 2] - B) > 90) on[y * w + x] = 1;
  }
  // 가로로 길게 이어진 줄(격자·구분선·메뉴 띠)은 빼기
  const rowFull = new Uint8Array(h);
  for (let y = 0; y < h; y++) { let c = 0; for (let x = 0; x < w; x++) c += on[y * w + x]; rowFull[y] = c > w * 0.5 ? 1 : 0; }
  // 위 6%(상태줄·메뉴), 아래 8%(시간축), 오른쪽 14%(가격축)는 빼기
  const y0 = Math.round(h * 0.06), y1 = Math.round(h * 0.92), x1 = Math.round(w * 0.86);
  const mid = new Float32Array(w).fill(NaN), top = new Float32Array(w).fill(NaN), bot = new Float32Array(w).fill(NaN);
  for (let x = 0; x < x1; x++) {
    const ys = [];
    for (let y = y0; y < y1; y++) if (!rowFull[y] && on[y * w + x]) ys.push(y);
    if (ys.length >= 2) { mid[x] = (ys[0] + ys[ys.length - 1] + 2 * ys[ys.length >> 1]) / 4; top[x] = ys[0]; bot[x] = ys[ys.length - 1]; }
  }
  // 캔들 사이 빈 열 때문에 흔들리지 않게 앞뒤 3열 평균으로 부드럽게
  const sm = new Float32Array(w).fill(NaN);
  for (let x = 0; x < w; x++) {
    let c = 0, t = 0;
    for (let j = Math.max(0, x - 3); j <= Math.min(w - 1, x + 3); j++) if (mid[j] === mid[j]) { c++; t += mid[j]; }
    if (c >= 3) sm[x] = t / c;
  }
  // 잔물결: 앞뒤 8열 평균을 뺀 값 (전체 추세가 아니라 캔들 하나하나의 오르내림으로 자리를 찾음)
  const hp = new Float32Array(w).fill(NaN);
  for (let x = 0; x < w; x++) {
    if (mid[x] !== mid[x]) continue;
    let c = 0, t = 0;
    for (let j = Math.max(0, x - 8); j <= Math.min(w - 1, x + 8); j++) if (mid[j] === mid[j]) { c++; t += mid[j]; }
    if (c >= 6) hp[x] = mid[x] - t / c;
  }
  return { w, h, k, nw, nh, mid: sm, hp, top, bot };
}
// 두 열 묶음의 상관계수 (sx·tx로 A 열을 B 열에 대응)
function corrAt(xa, va, Bv, Bw, sx, tx, minN) {
  let n = 0, s1 = 0, s2 = 0, s11 = 0, s22 = 0, s12 = 0;
  for (let i = 0; i < xa.length; i++) {
    const xb = Math.round(sx * xa[i] + tx);

    const yb = Bv[xb];
    if (yb !== yb) continue;
    const yA = va[i];
    n++; s1 += yA; s2 += yb; s11 += yA * yA; s22 += yb * yb; s12 += yA * yb;

async function alignImages(urlA, urlB) {

  const lim = Math.round(A.w * 0.7), xh = [], vh = [], xl = [], vl = [];
  for (let x = 0; x < lim; x++) {
    if (A.hp[x] === A.hp[x]) { xh.push(x); vh.push(A.hp[x]); }
    if (A.mid[x] === A.mid[x]) { xl.push(x); vl.push(A.mid[x]); }
  }
  if (xh.length < 20) return null;
  const minN = Math.max(20, xh.length * 0.35);

  const tryOne = (sx, tx) => {
    const c = corrAt(xh, vh, Bs.hp, Bs.w, sx, tx, minN);
    if (!c || c.r <= 0) return;
    // 겹친 구간이 넓을수록, 배율이 1에 가까울수록 우대 (같은 휴대폰·같은 확대로 찍는 경우가 대부분)
    const score = c.r - 0.15 * (1 - c.n / xh.length) - 0.08 * Math.abs(Math.log(sx));
    if (!best || score > best.score) best = { score, r: c.r, sx, tx };
  };
  for (let ls = -0.7; ls <= 0.7001; ls += 0.01) {
    const sx = Math.exp(ls);

    if (Math.round((ls + 0.7) * 100) % 20 === 19) await new Promise(r => setTimeout(r, 0));   // 화면이 멈추지 않게
  }
  if (!best) return null;
  // 가까운 곳 다듬기: 잔물결 + 높이 흐름을 같이 보고 더 잘 맞는 자리로
  const c0 = { ...best };

  for (let sx = c0.sx * 0.94; sx <= c0.sx * 1.0601; sx += c0.sx * 0.0025)

      if (!h1 || !l1) continue;

    }
  if (fine) { best.sx = fine.sx; best.tx = fine.tx; best.r = fine.r; }
  // 세로: 찾은 가로 자리에서 캔들 위끝·아래끝끼리 배율·이동 맞춤 (어긋난 점은 한 번 걸러냄)
  const pts = [];
  for (let x = 0; x < lim; x++) {
    const xb = Math.round(best.sx * x + best.tx);
    if (xb < 0 || xb >= Bs.w) continue;
    if (A.top[x] === A.top[x] && Bs.top[xb] === Bs.top[xb]) pts.push([A.top[x], Bs.top[xb]]);
    if (A.bot[x] === A.bot[x] && Bs.bot[xb] === Bs.bot[xb]) pts.push([A.bot[x], Bs.bot[xb]]);
  }
  const fitLine = list => {
    const n = list.length; if (n < 10) return null;
    let s1 = 0, s2 = 0; list.forEach(([u, v]) => { s1 += u; s2 += v; });
    const m1 = s1 / n, m2 = s2 / n; let vA = 0, vB = 0, cv = 0;
    list.forEach(([u, v]) => { vA += (u - m1) ** 2; vB += (v - m2) ** 2; cv += (u - m1) * (v - m2); });
    if (vA <= 0 || cv <= 0) return null;
    const a = Math.sqrt(vB / vA); return { a, b: m2 - a * m1 };
  };
  let ln = fitLine(pts);
  if (!ln) return null;
  const res = pts.map(([u, v]) => Math.abs(v - (ln.a * u + ln.b))).sort((p, q) => p - q);
  const cut = Math.max(2, res[Math.floor(res.length * 0.5)] * 3);

  // 맞춤 확신도: 맞춘 자리에서 캔들 위끝·아래끝이 맞춘 선 가까이(사진 높이 1.5% 안)에 있는 비율
  const tol = Bs.h * 0.015;
  const good = pts.filter(([u, v]) => Math.abs(v - (a * u + b)) <= tol).length / pts.length;
  return { sx: best.sx * A.k / Bs.k, tx: best.tx / Bs.k, sy, ty: b / Bs.k, r: best.r, good };
}

let cmp = null;   // { a, b: 사진 url[], ai, bi, mode: 'wipe'|'fade', v, fit, status, adjust, cache }
function openCompare(a, b) {
  if (!a.length || !b.length) { uiAlert('예측 사진과 지금 사진이 모두 있어야 비교할 수 있어요.'); return; }

async function runAlign(force) {
  if (!cmp) return;
  const key = cmp.ai + '|' + cmp.bi, mine = cmp;
  if (!force && cmp.cache[key]) { cmp.fit = cmp.cache[key].fit; cmp.status = cmp.cache[key].status; renderCompare(); return; }
  cmp.status = 'aligning'; cmp.fit = null; renderCompare();
  let fit = null;
  try { fit = await alignImages(cmp.a[cmp.ai], cmp.b[cmp.bi]); } catch (e) { fit = null; }
  if (cmp !== mine || key !== cmp.ai + '|' + cmp.bi) return;   // 그 사이 닫았거나 사진을 바꿈
  cmp.fit = fit;
  // 맞춤 확신도(good): 테스트에서 맞는 사진 0.77~0.96, 엉뚱한 사진 0.17
  cmp.status = !fit ? 'fail' : fit.good >= 0.6 ? 'ok' : fit.good >= 0.4 ? 'weak' : 'fail';

function cmpTopStyle() { return cmp.mode === 'wipe' ? `clip-path:inset(0 0 0 ${cmp.v}%)` : `opacity:${cmp.v / 100}`; }

  const st = $('cmpStage'), a = $('cmpA'), b = $('cmpB');
  if (!st || !a || !b || !a.naturalWidth || !b.naturalWidth) return;
  const W = st.clientWidth, H = st.clientHeight, k = cmpScaleK();
  const bw = b.naturalWidth * k, bh = b.naturalHeight * k, bx = (W - bw) / 2, by = (H - bh) / 2;
  Object.assign(b.style, { left: bx + 'px', top: by + 'px', width: bw + 'px', height: bh + 'px' });
  if (cmp.fit) {
    const f = cmp.fit;
    Object.assign(a.style, { left: (bx + f.tx * k) + 'px', top: (by + f.ty * k) + 'px', width: (a.naturalWidth * f.sx * k) + 'px', height: (a.naturalHeight * f.sy * k) + 'px' });
  } else {
    const ka = Math.min(W / a.naturalWidth, H / a.naturalHeight);
    const aw = a.naturalWidth * ka, ah = a.naturalHeight * ka;
    Object.assign(a.style, { left: (W - aw) / 2 + 'px', top: (H - ah) / 2 + 'px', width: aw + 'px', height: ah + 'px' });
  }
}
window.addEventListener('resize', () => { if (cmp) cmpPlace(); });
function cmpVal(v) {
  if (!cmp) return;
  cmp.v = Math.max(0, Math.min(100, Number(v) || 0));
  const top = $('cmpTop'), line = $('cmpLine'), range = $('cmpRange'), lab = $('cmpLabR');
  if (top) top.setAttribute('style', cmpTopStyle());
  if (line) line.style.left = cmp.v + '%';
  if (range && Number(range.value) !== cmp.v) range.value = cmp.v;
  if (lab && cmp.mode === 'fade') lab.textContent = `지금 ${cmp.v}%`;
}
// 직접 맞추기를 시작할 때 맞춘 값이 없으면 '두 사진을 같은 크기로 겹친 상태'에서 시작
function cmpEnsureFit() {
  if (cmp.fit) return;
  const a = $('cmpA'), b = $('cmpB');
  if (!a || !b || !a.naturalWidth || !b.naturalWidth) return;
  const s = Math.min(b.naturalWidth / a.naturalWidth, b.naturalHeight / a.naturalHeight);
  cmp.fit = { sx: s, sy: s, tx: (b.naturalWidth - a.naturalWidth * s) / 2, ty: (b.naturalHeight - a.naturalHeight * s) / 2, r: 0 };
}

// 기간 시작 시각 (오늘 0시 / 이번 주 월요일 0시 / 이번 달 1일 0시)
function periodStart(k) {
  const d = new Date(); d.setHours(0, 0, 0, 0);
  if (k === 'today') return d.getTime();
  if (k === 'week') { d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d.getTime(); }
  if (k === 'month') { d.setDate(1); return d.getTime(); }
  return 0;
}

function groupRows(items, keyOf, labelOf, order, clickFn) {
  const groups = {};
  items.forEach(it => { const k = keyOf(it); (groups[k] = groups[k] || []).push(it); });
  return Object.keys(groups).sort(order).map(k => {
    const g = groups[k], avg = avgOf(g);
    return `<div class="brow click" onclick="${clickFn(k)}">
      <span class="nm">${esc(labelOf(k))}</span>
      <span class="bar"><i style="width:${(avg / 5 * 100).toFixed(0)}%;background:${scoreColor(avg)}"></i></span>
      <span class="v"><b>${avg.toFixed(1)}</b>점 · ${g.length}건</span>
    </div>`;
  }).join('');
}

/* =========================== 용량 관리 =========================== */
let cleanMonths = 6;
async function storageInfo() {
  let usage = null, quota = null;
  try { if (navigator.storage && navigator.storage.estimate) { const e = await navigator.storage.estimate(); usage = e.usage; quota = e.quota; } } catch (e) {}
  const photos = await getAll('photos');
  const res = { usage, quota, nA: 0, nR: 0, sA: 0, sR: 0, nB: 0, sB: 0 };
  photos.forEach(p => {
    const sz = (p.blob && p.blob.size) || 0;
    if (p.kind === 'result') { res.nR++; res.sR += sz; }
    else if (p.kind === 'backtest' || p.kind === 'btexplain') { res.nB++; res.sB += sz; }
    else { res.nA++; res.sA += sz; }
  });
  return res;
}
// 정리 대상: 검증한 지 N개월이 지난 검증 완료 예측, 기록한 지 N개월이 지난 백테스트의 사진
async function cleanupTargets(months) {
  const cut = Date.now() - months * 30.44 * 86400000;
  const items = (await doneItems()).filter(it => it.t < cut && ((it.p.photoIds || []).length || (it.r.resultPhotoIds || []).length));
  const bts = (await getAll('backtests')).filter(b => b.createdAt < cut && ((b.photoIds || []).length || (b.explainPhotoIds || []).length));
  const ids = [];
  items.forEach(it => ids.push(...(it.p.photoIds || []), ...(it.r.resultPhotoIds || [])));
  bts.forEach(b => ids.push(...(b.photoIds || []), ...(b.explainPhotoIds || [])));
  let bytes = 0;
  for (const id of ids) { const ph = await getOne('photos', id); if (ph && ph.blob) bytes += ph.blob.size || 0; }
  return { items, bts, ids, bytes };
}
async function runCleanup() {
  const t = await cleanupTargets(cleanMonths);
  if (!t.ids.length) { toast('지울 사진이 없어요'); return; }
  const ok = await uiConfirm(`${cleanMonths >= 12 ? '1년' : cleanMonths + '개월'}보다 오래된 검증 완료 예측 ${t.items.length}건, 백테스트 ${t.bts.length}개의 사진 ${t.ids.length}장(${mb(t.bytes)})을 지울까요?\n\n점수·이유·종목·시간대·결과는 남아서 통계에 그대로 반영돼요.\n지운 사진은 되돌릴 수 없으니 먼저 전체 백업을 권해요.`, '사진 지우기', true);
  if (!ok) return;
  const now = Date.now(), ops = [];
  t.ids.forEach(id => ops.push({ store: 'photos', type: 'delete', key: id }));
  t.items.forEach(it => {
    ops.push({ store: 'predictions', type: 'put', value: { ...it.p, photoIds: [], photosCleanedAt: now } });
    ops.push({ store: 'reviews', type: 'put', value: { ...it.r, resultPhotoIds: [] } });
  });
  t.bts.forEach(b => ops.push({ store: 'backtests', type: 'put', value: { ...b, photoIds: [], explainPhotoIds: [], photosCleanedAt: now } }));
  try { await writeMany(ops); } catch (e) { uiAlert('정리하지 못했어요.\n' + (e && e.message ? e.message : '')); return; }
  toast(`사진 ${t.ids.length}장을 지웠어요`); render();
}
async function deleteCanceled() {
  const ps = (await getAll('predictions')).filter(p => p.status === 'canceled');
  if (!ps.length) { toast('취소된 예측이 없어요'); return; }
  if (!(await uiConfirm(`취소된 예측 ${ps.length}건을 사진까지 모두 지울까요?\n되돌릴 수 없어요.`, '모두 삭제', true))) return;
  const ops = [];
  for (const p of ps) {
    const r = await getOne('reviews', p.id);
    ops.push({ store: 'predictions', type: 'delete', key: p.id }, { store: 'reviews', type: 'delete', key: p.id });
    [...(p.photoIds || []), ...((r && r.resultPhotoIds) || [])].forEach(id => ops.push({ store: 'photos', type: 'delete', key: id }));
  }
  await writeMany(ops);
  toast(`취소된 예측 ${ps.length}건을 지웠어요`); render();
}

async function saveSymbol(id) {

  if (symbols.some(s => s.name === name && s.id !== id)) { uiAlert('같은 이름의 종목이 이미 있어요.'); return; }
  const base = id ? symMap[id] : { id: uid(), order: symbols.length ? Math.max(...symbols.map(s => s.order)) + 1 : 0 };

async function deleteSymbol(id) {
  const n = (await getAll('predictions')).filter(p => p.symbolId === id).length + (await getAll('backtests')).filter(b => b.symbolId === id).length;
  if (n) { uiAlert(`이 종목에 예측·백테스트 기록이 ${n}건 있어 삭제할 수 없어요.\n기록을 지키기 위한 보호 기능이에요.`); return; }
  if (!(await uiConfirm(`'${symMap[id].name}' 종목을 삭제할까요?`, '삭제', true))) return;
  await writeMany([{ store: 'symbols', type: 'delete', key: id }]);
  await loadSymbols(); closeModal(); toast('삭제했어요'); render();
}
async function moveSymbol(i, dir) {
  const a = symbols[i], b = symbols[i + dir];
  if (!a || !b) return;
  await writeMany([{ store: 'symbols', type: 'put', value: { ...a, order: b.order } }, { store: 'symbols', type: 'put', value: { ...b, order: a.order } }]);
  await loadSymbols(); render();
}

async function importFile(input) {
  const file = input.files && input.files[0];
  try { input.value = ''; } catch (e) {}
  if (!file) return;
  let obj = null;
  toast('파일을 읽는 중…');
  try { obj = parseBackup(await file.text()); } catch (e) { obj = null; }
  if (!obj || obj.app !== APP_ID || !obj.data) { uiAlert('이 앱의 백업 파일이 아니에요.\n설정 → 내보내기로 만든 .html 파일(또는 예전 .json 백업)을 고르세요.'); return; }
  const d = obj.data, cnt = k => (d[k] || []).length, partial = obj.kind && obj.kind !== 'full';
  showModal(`<h3>백업 가져오기</h3>
    <div class="sub">${esc(EXPORT_KINDS[obj.kind] || '전체 백업')} · ${esc(obj.version || '')} · ${fmtDate(obj.exportedAt)}</div>
    <dl class="kv" style="margin:14px 0">
      <dt>종목</dt><dd>${cnt('symbols')}개</dd><dt>예측</dt><dd>${cnt('predictions')}건</dd>
      <dt>검증</dt><dd>${cnt('reviews')}건</dd><dt>백테스트</dt><dd>${cnt('backtests')}개</dd><dt>영상</dt><dd>${cnt('videos')}개</dd><dt>운동 기록</dt><dd>${cnt('exerciseLogs')}건</dd><dt>사진</dt><dd>${cnt('photos')}장</dd></dl>
    <div class="hint">${partial ? '이 파일은 일부 기록만 담고 있어 <b>합치기</b>만 할 수 있어요. 지금 기록은 두고 파일의 기록을 더합니다 (같은 기록은 파일 내용으로 갱신).' : '<b>덮어쓰기</b>: 지금 기록을 모두 지우고 백업으로 바꿉니다.<br><b>합치기</b>: 지금 기록은 두고 백업 내용을 더합니다 (같은 기록은 백업 내용으로 갱신).'}</div>
    <div class="btnrow"><button class="btn" onclick="App.closeModal()">취소</button><button class="btn ${partial ? 'primary' : ''}" onclick="App.doImport('merge')">합치기</button>${partial ? '' : `<button class="btn danger" onclick="App.doImport('overwrite')">덮어쓰기</button>`}</div>`);
  pendingImport = obj;
}
async function doImport(mode) {
  if (!pendingImport) return;
  if (mode === 'overwrite' && pendingImport.kind && pendingImport.kind !== 'full') { uiAlert('일부만 담은 파일은 덮어쓰기를 할 수 없어요.'); return; }
  if (mode === 'overwrite' && !(await uiConfirm('지금 기록을 모두 지우고 백업으로 바꿀까요?', '덮어쓰기', true))) return;
  try {
    const d = pendingImport.data, ops = [];
    if (mode === 'overwrite') STORES.forEach(s => ops.push({ store: s, type: 'clear' }));
    DATA_STORES.forEach(s => (d[s] || []).forEach(v => ops.push({ store: s, type: 'put', value: v })));
    (d.photos || []).forEach(p => { const { dataUrl, ...rest } = p; if (dataUrl) ops.push({ store: 'photos', type: 'put', value: { ...rest, blob: dataURLToBlob(dataUrl) } }); });
    const imported = (d.settings || []).find(x => x.key === 'main');
    // 마지막 백업 시각은 지금 휴대폰 기준을 유지 (백업 파일 안의 값은 백업 직전이라 비어 있음)
    const next = mode === 'overwrite' && imported ? { ...defaultSettings(), ...imported, key: 'main', seeded: true, lastBackup: S.lastBackup } : { ...S, seeded: true };
    ops.push({ store: 'settings', type: 'put', value: next });
    await writeMany(ops);
    pendingImport = null;
    await loadSettings(); await loadSymbols(); await loadTechniques();
    await dedupeByName('exercises', [{ store: 'exerciseLogs', field: 'exerciseId' }], e => e.active !== false);
    closeModal(); toast('백업을 가져왔어요');
    view = 'today'; render();
  } catch (e) { uiAlert('가져오기에 실패했어요. 기존 기록은 그대로입니다.\n' + (e && e.message ? e.message : '')); }
}

async function loadTechniques() {

async function addTechniqueByName(name) {

  if (!name) return null;

function techStats(bts, id) {

async function renderBacktest() {
  const bts = await getAll('backtests'), n = todayBacktestCount(bts), goal = S.scores.backtestGoal;
  let h = `<section class="scorecard">
    <div class="big"><b>${n}</b><span>/ ${goal}개 · 오늘</span><div class="streak"><b>${bts.length}개</b>전체</div></div>
    <div class="goalbar ${n >= goal ? 'done' : ''}"><i style="width:${Math.min(100, Math.round(n / goal * 100))}%"></i></div>
    <button class="btn primary wide" onclick="App.newBt()">＋ 백테스트 추가</button>
  </section>`;
  if (!techniques.length && !bts.length) {
    h += `<div class="empty">아직 백테스트가 없어요.<br>기법별로 과거 차트를 찾아 캡처하고<br>성공·실패 이유를 남겨 보세요.</div>`;
    $('view').innerHTML = h; return;

async function saveBt(cont) {
  const f = bf, errors = [];
  if (!f.techniqueId || !techMap[f.techniqueId]) errors.push('기법을 고르거나 새로 입력하세요.');
  if (!f.result) errors.push('결과(성공/실패)를 고르세요.');
  if (!f.symbolId || !symMap[f.symbolId]) errors.push('종목을 고르세요.');
  if (!f.timeframe) errors.push('시간대를 고르세요.');
  if (!f.photos.length) errors.push('기본 차트 사진을 1장 이상 넣으세요.');
  if (f.reason.trim().length < 10) errors.push('성공·실패 이유를 10자 이상 적으세요.');
  if (errors.length) { uiAlert(errors.join('\n')); return; }
  const now = Date.now(), ops = [], id = f.mode === 'edit' ? f.orig.id : uid();
  const keep = (list, kind) => list.map(ph => {
    if (!ph.isNew) return ph.id;
    const pid = uid();
    ops.push({ store: 'photos', type: 'put', value: { id: pid, blob: ph.blob, backtestId: id, kind, createdAt: now } });
    return pid;
  });
  const photoIds = keep(f.photos, 'backtest'), explainPhotoIds = keep(f.explain, 'btexplain');
  f.removedPhotoIds.forEach(pid => ops.push({ store: 'photos', type: 'delete', key: pid }));
  const base = f.mode === 'edit' ? f.orig : { id, createdAt: now };
  ops.push({ store: 'backtests', type: 'put', value: { ...base, techniqueId: f.techniqueId, result: f.result, symbolId: f.symbolId,
    timeframe: f.timeframe, photoIds, explainPhotoIds, reason: f.reason.trim(), updatedAt: now } });
  try { await writeMany(ops); }
  catch (e) { uiAlert('저장에 실패했어요. 저장 공간이 부족할 수 있어요.\n' + ((e && e.message) || '')); return; }
  S.lastBt = { techniqueId: f.techniqueId, symbolId: f.symbolId, timeframe: f.timeframe }; await saveSettings();
  if (cont && f.mode === 'new') {
    // 저장하고 다음: 기법·종목·시간대는 그대로, 결과·사진·이유만 비움
    [...f.photos, ...f.explain].forEach(ph => URL.revokeObjectURL(ph.url));
    bf = { ...f, result: '', photos: [], explain: [], reason: '', removedPhotoIds: [], dirty: false };
    window.scrollTo(0, 0);
    await renderBtForm();
    const n = todayBacktestCount(await getAll('backtests')), g = S.scores.backtestGoal;
    toast(n === g ? `오늘 ${n}개 달성! 보너스 ${S.scores.backtestBonus}점` : `저장 · 오늘 ${n}개`);
    return;
  }
  toast(f.mode === 'edit' ? '수정했어요' : '저장했어요');
  leaveSub();
}

const OLD_DEFAULT_LINKS = ['https://www.youtube.com/watch?v=21iOcDfoOGg', 'https://www.youtube.com/watch?v=rmJ4S_Ws75c',
  'https://www.youtube.com/watch?v=uPOWvBj7nFY', 'https://www.youtube.com/watch?v=A4M2sNWU1Qk'];
const EX_VERSION = 2;
async function seedExercises() {
  const all = await getAll('exercises'), now = Date.now(), ops = [];
  const addNew = () => DEFAULT_EXERCISES.forEach((e, i) => {
    if (!all.some(x => x.link === e.link && x.active !== false)) ops.push({ store: 'exercises', type: 'put', value: { id: uid(), ...e, order: 100 + i, active: true, createdAt: now } });
  });
  if (!S.exSeeded) {
    if (!all.length) addNew();
  } else if ((S.exVersion || 1) < EX_VERSION) {
    // 예전 기본 항목만 정리: 기록이 있으면 목록에서만 빼고(지난 점수 유지), 없으면 삭제. 직접 만든 항목은 그대로
    const used = new Set((await getAll('exerciseLogs')).map(l => l.exerciseId));
    all.forEach(e => {
      const old = OLD_DEFAULT_LINKS.includes(e.link) || (e.name === '걷기 30분' && !e.link);
      if (!old) return;
      if (used.has(e.id)) ops.push({ store: 'exercises', type: 'put', value: { ...e, active: false } });
      else ops.push({ store: 'exercises', type: 'delete', key: e.id });
    });
    addNew();
  } else return;
  S.exSeeded = true; S.exVersion = EX_VERSION;
  ops.push({ store: 'settings', type: 'put', value: S });
  await writeMany(ops);
}
